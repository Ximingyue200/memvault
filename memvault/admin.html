<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cradle · 记忆库</title>
<style>
:root{
  --bg:#0d0f12; --panel:#14171c; --line:#242931; --line2:#2f3540;
  --tx:#e6e9ef; --tx2:#9aa3b0; --tx3:#6b7280;
  --blue:#5aa9ff; --green:#5fd48a; --amber:#ffc857; --red:#ff6b6b;
  --violet:#b48cff; --pink:#ff8fab;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}
button,input,select{font:inherit;color:inherit}

.app{display:flex;height:100vh;height:100dvh}

/* ── 侧栏 ── */
aside{width:186px;flex:0 0 186px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:14px 0}
.brand{padding:0 16px 16px;font-weight:600;letter-spacing:.02em}
.brand b{color:var(--blue)}
.brand small{display:block;color:var(--tx3);font-weight:400;font-size:11px;margin-top:2px}
nav{flex:1;overflow-y:auto}
nav a{display:flex;align-items:center;gap:9px;padding:9px 16px;color:var(--tx2);
  text-decoration:none;font-size:13px;border-left:2px solid transparent}
nav a:hover{background:#1a1e24;color:var(--tx)}
nav a.on{color:var(--tx);border-left-color:var(--blue);background:#181c22}
nav a i{width:15px;text-align:center;font-style:normal;opacity:.85;font-size:13px}
.foot{padding:10px 16px 0;border-top:1px solid var(--line);color:var(--tx3);font-size:11px}

/* ── 主区 ── */
main{flex:1;min-width:0;overflow-y:auto;padding:18px 20px 80px}
h1{font-size:19px;margin:0 0 4px;font-weight:600}
.sub{color:var(--tx3);font-size:12px;margin-bottom:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.01em}
.stat .k{color:var(--tx3);font-size:11px;margin-top:2px}
.stat.b .v{color:var(--blue)} .stat.g .v{color:var(--green)}
.stat.a .v{color:var(--amber)} .stat.r .v{color:var(--red)}
.stat.v2 .v{color:var(--violet)}

.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line2);
  border-radius:9px;padding:10px 13px;outline:none}
input[type=text]:focus{border-color:var(--blue)}
select{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:10px 10px}
button{background:var(--blue);border:0;border-radius:9px;padding:10px 16px;cursor:pointer;
  color:#08121e;font-weight:600}
button.ghost{background:var(--panel);border:1px solid var(--line2);color:var(--tx2);font-weight:400}
button:active{transform:translateY(1px)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer}
.card:hover{border-color:var(--line2);background:#171b21}
.card .t{font-size:14px;font-weight:500;margin-bottom:4px;
  overflow-wrap:anywhere;word-break:break-word}
.card .b{color:var(--tx2);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere;
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{margin-top:7px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  font-size:11px;color:var(--tx3)}
button.danger{background:var(--red) !important;color:#1a1015}
.sg{display:grid;grid-template-columns:78px 1fr;gap:10px 12px;align-items:center;max-width:420px}
.sg label{font-size:12px;color:var(--tx2)}
.sg input,.sg select{background:#141920;border:1px solid #21262d;border-radius:6px;padding:7px 9px;
  font-size:13px;color:var(--tx);font-family:inherit;width:100%}
.tag{padding:1px 7px;border-radius:5px;background:#1e232b;border:1px solid var(--line)}
.tag.k{color:var(--blue)} .tag.s{color:var(--green)}
.tag.w{color:var(--amber)} .tag.d{color:var(--red)}
.num{color:var(--tx3);font-variant-numeric:tabular-nums}

.detail{background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:16px 18px;margin-bottom:14px}
.detail h2{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}
.detail .body{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  color:var(--tx2);font-size:13.5px;line-height:1.75}
.evid{color:var(--blue);text-decoration:none;border-bottom:1px dashed rgba(90,169,255,.5);margin-right:3px}
.ev{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ev .q{border-left:2px solid var(--line2);padding-left:10px;margin:7px 0;
  color:var(--tx2);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .r{font-size:11px;color:var(--tx3);margin-bottom:2px}

.thread{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.thread .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.thread .nt{color:var(--tx3);font-size:12px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:7px}
.dot.active{background:var(--green)} .dot.blocked{background:var(--red)}
.dot.shifted{background:var(--amber)} .dot.done{background:var(--tx3)}

.chron{display:flex;gap:0;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:12px;
  color:var(--tx2);cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:#1b2431;border-color:var(--blue);color:var(--tx)}
.turns{margin-top:12px}
.turn{font-size:12.5px;color:var(--tx2);padding:5px 0 5px 12px;
  border-left:2px solid var(--line2);margin-bottom:4px;overflow-wrap:anywhere}
.muted{color:var(--tx3);font-size:12px}
.spin{color:var(--tx3);font-size:13px;padding:20px 0;text-align:center}

@media (max-width:760px){
  .app{flex-direction:column}
  aside{width:auto;flex:0 0 auto;flex-direction:row;align-items:center;
    padding:0;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{display:none}
  nav{display:flex;overflow-x:auto}
  nav a{flex:0 0 auto;border-left:0;border-bottom:2px solid transparent;padding:11px 13px}
  nav a.on{border-left:0;border-bottom-color:var(--blue);background:transparent}
  nav a i{display:none}
  .foot{display:none}
  main{padding:14px 13px 70px}
}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.prow{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start}
.pk{font-size:11px;color:var(--tx3);flex:none;width:30px;padding-top:3px}
.pv{font-size:14px;line-height:1.55;color:var(--tx)}
.pv.act{color:var(--blue);font-family:ui-monospace,monospace;font-size:13px}
.pmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--tx3)}
.dl{cursor:pointer;color:var(--blue);text-decoration:none;border-bottom:1px dashed rgba(90,169,255,.4)}
.st.confirmed{color:var(--green)} .st.rejected{color:var(--red)} .st.draft{color:var(--amber)}
.tools{display:flex;gap:10px;align-items:center;margin:12px 0}
.tools button{background:var(--blue);border:0;border-radius:6px;padding:8px 16px;color:#0b1220;font-size:13px;font-weight:600;cursor:pointer}
.tools button:disabled{opacity:.5}
.hint{font-size:12px;color:var(--tx3)}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.sq{font-size:15px;color:var(--tx);margin-bottom:10px;line-height:1.5}
.sc{font-size:13.5px;color:var(--tx2);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.sm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:11.5px;color:var(--tx3)}
.stale{color:var(--amber)}
.icard{border:1px solid #232833;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#14171e}
.ihead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.itime{font:12px/1 ui-monospace,monospace;color:var(--tx3)}
.itag{font:11px/1 ui-monospace,monospace;color:var(--green);border:1px solid #2a4a35;border-radius:4px;padding:2px 5px}
.inum{font:12px/1 ui-monospace,monospace;color:var(--tx3);margin-left:auto}
.iq{font-size:14px;line-height:1.6;color:var(--tx)}
.imeta{margin-top:8px;font:12px/1.6 ui-monospace,monospace;color:var(--tx3)}
.fcard.done{opacity:.72}
.fdot.done{background:var(--green)}
.freopen{color:var(--tx3);text-decoration:none;font-size:11.5px;margin-left:auto}
.fk.done{color:var(--green)}
.fclose{color:var(--green);text-decoration:none;font-size:11.5px;margin-left:auto;white-space:nowrap}
.fcard{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.ftop{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.fdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.fti{font-size:15px;font-weight:600;color:var(--tx)}
.frow{display:flex;gap:8px;font-size:13px;color:var(--tx2);margin-top:4px}
.fk{font-size:11px;color:var(--amber);flex:none;width:56px;padding-top:2px}
.fmeta{font-size:11px;color:var(--tx3);margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>cradle</b> 记忆库<small>memvault</small></div>
    <nav>
      <a href="#home"   data-v="home"><i>◱</i>总览</a>
      <a href="#profile" data-v="profile"><i>◉</i>画像</a>
      <a href="#search" data-v="search"><i>⌕</i>记忆</a>
      <a href="#chron"  data-v="chron"><i>≣</i>编年史</a>
      <a href="#threads" data-v="threads"><i>◎</i>线索</a>
      <a href="#dream"  data-v="dream"><i>☾</i>梦境</a>
      <a href="#proc"   data-v="proc"><i>⚙</i>程序</a>
      <a href="#focus"  data-v="focus"><i>◎</i>任务</a>
      <a href="#summ"   data-v="summ"><i>¶</i>摘要</a>
      <a href="#inject" data-v="inject"><i>⇄</i>注入</a>
      <a href="/tree2d" target="_self"><i>✧</i>导图</a>
      <a href="/star3d" target="_self"><i>✦</i>3D 图</a>
    </nav>
    <div class="foot" id="foot">—</div>
  </aside>
  <main id="main"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseEv(v){
  if(!v) return [];
  let a = v;
  if(typeof v === 'string'){ try{ a = JSON.parse(v); }catch(e){ a = String(v).split(/[^\d]+/); } }
  if(!Array.isArray(a)) a = [];
  return a.map(x => String(x).trim()).filter(Boolean).slice(0, 12);
}
const KIND = {definition:'定义', fact:'事实', event:'事件', experience:'经验',
              preference:'偏好', tool:'工具', note:'笔记', rule:'规则', archive:'归档'};
let STATS = null;

async function j(u){ const r = await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }

function nav(v, sync=true){
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===v));
  ({home:viewHome, search:viewSearch, chron:viewChron, threads:viewThreads, dream:viewDream,
    proc:viewProc, focus:viewFocus, inject:viewInject, summ:viewSumm,
    profile:viewProfile}[v] || viewHome)();
  if(sync) location.hash = v;
}
window.addEventListener('hashchange', () => {
  const v = (location.hash || '#home').slice(1) || 'home';
  nav(v, false);
});

/* ── 梦境 ── */
let DST = '', DK = 'human';
async function viewProfile(){
  $('#main').innerHTML = '<h1>画像</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const d = await j('/profile');
    const st = d.stats || {};
    const dg = d.dreams || [], pg = d.proc_groups || [], rg = d.pref_groups || [], fg = d.focus || [];
    const ev = ids => (ids||[]).slice(0,6).map(i=>`<a class="evid" href="#search" onclick="window.__card=${i}">${i}</a>`).join('');
    $('#main').innerHTML = `
      <h1>画像</h1>
      <div class="sub">关于他的一切，聚在一页 · 不调模型，纯聚合</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat a"><div class="v">${st.cards||0}</div><div class="k">卡片</div></div>
        <div class="stat g"><div class="v">${st.dreams||0}</div><div class="k">梦</div></div>
        <div class="stat b"><div class="v">${st.procedures||0}</div><div class="k">做事套路</div></div>
      </div>

      <div id="psum" style="margin:18px 0 6px"></div>

      <details style="margin:22px 0 0">
      <summary style="cursor:pointer;color:var(--tx3);font-size:12px;padding:8px 0">展开：${dg.length} 条关于他的判断</summary>
      ${dg.map(x=>`
        <div class="fcard">
          <div class="ftop"><span class="fdot"></span><span class="fti">${esc(x.title)}</span></div>
          <div style="color:var(--tx2);font-size:13.5px;line-height:1.75;margin-top:8px;white-space:pre-wrap">${esc((x.body||'').slice(0,400))}${(x.body||'').length>400?'…':''}</div>
          <div class="fmeta">${esc(x.kind||'human')} · ${esc(x.span||'')} ${ev(x.evidence)}</div>
        </div>`).join('') || '<div class="sub">（还没有梦）</div>'}
      </details>

      <h1 style="font-size:16px;margin:26px 0 8px">他怎么做事</h1>
      <div class="sub" style="margin-bottom:12px">遇到这类问题他就这么做 —— 从 event/experience 里抽的</div>
      ${pg.map(g=>`
        <div style="margin:14px 0 6px;color:var(--tx3);font-size:12px">${esc(g.category)}（${g.items.length}）</div>
        ${g.items.map(x=>`
          <div class="pcard">
            <div class="prow"><span class="pk">情境</span><div class="pv">${esc(x.situation)}</div></div>
            <div class="prow"><span class="pk">动作</span><div class="pv act">${esc(x.action)}</div></div>
            <div class="prow"><span class="pk">结果</span><div class="pv">${esc(x.result)}</div></div>
            <div class="pmeta">${ev(x.evidence)}</div>
          </div>`).join('')}`).join('') || '<div class="sub">（还没有套路）</div>'}

      <h1 style="font-size:16px;margin:26px 0 8px">他偏好什么</h1>
      <div class="sub" style="margin-bottom:12px">${st.preferences||0} 张偏好卡，按分类分组</div>
      ${rg.map(g=>`
        <div style="margin:14px 0 6px;color:var(--tx3);font-size:12px">${esc(g.category)}（${g.items.length}）</div>
        ${g.items.slice(0,8).map(x=>`
          <div class="fcard" style="margin:8px 0">
            <div class="fti" style="font-size:14px">${esc(x.title)}</div>
            <div style="color:var(--tx2);font-size:12.5px;margin-top:6px;line-height:1.7">${esc((x.body||'').slice(0,160))}${(x.body||'').length>160?'…':''}
              <a class="evid" href="#search" onclick="window.__card=${x.id}">#${x.id}</a></div>
          </div>`).join('')}`).join('') || '<div class="sub">（还没有偏好）</div>'}

      <h1 style="font-size:16px;margin:26px 0 8px">正在做什么</h1>
      <div class="sub" style="margin-bottom:12px">${st.tasks_open||0} 件没做完 · ${st.tasks_done||0} 件已完成</div>
      ${fg.map(x=>`
        <div class="fcard">
          <div class="ftop"><span class="fdot"></span><span class="fti">${esc(x.topic)}</span></div>
          ${(x.open_items||[]).length ? `<div class="frow"><span class="fk">还没做完</span><div>${(x.open_items||[]).map(o=>esc(o)).join('；')}</div></div>` : ''}
          <div class="fmeta">${esc(x.conv_id||'')} · ${(x.last_ts||'').slice(0,16)}</div>
        </div>`).join('') || '<div class="sub">（没有未完成的事）</div>'}
    `;
    try{
      const p = await j('/profile/note');
      if (p && p.note){
        const n = p.note;
        $('#psum').innerHTML = `
          <div style="background:rgba(90,169,255,.07);border:1px solid rgba(90,169,255,.2);border-radius:12px;padding:16px 18px">
            <div style="font-size:15px;line-height:1.8;color:var(--tx)">${esc(n.summary||'')}</div>
            ${(n.points||[]).length ? `<div style="margin-top:14px;font-size:13px;line-height:2;color:var(--tx2)">
              ${n.points.map(x=>`<div>· <b style="color:var(--tx)">${esc(x.k||'')}</b> ${esc(x.v||'')}</div>`).join('')}
            </div>` : ''}
            ${(n.blind||[]).length ? `<div style="margin-top:12px;font-size:12.5px;line-height:1.9;color:var(--tx3)">
              <div style="color:var(--amber);margin-bottom:4px">盲点</div>
              ${n.blind.map(x=>`<div>· ${esc(x)}</div>`).join('')}
            </div>` : ''}
          </div>`;
      }
    }catch(e){}
  }catch(e){
    $('#main').innerHTML = '<h1>画像</h1><div class="sub">读取出错：'+esc(e.message)+'</div>';
  }
}

async function viewDream(){
  $('#main').innerHTML = '<h1>梦境</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const ALL = await j('/dreams?limit=200').then(d => d.items || []);
    const isHuman = x => x.kind === 'hand' || x.kind === 'human';
    const nHand = ALL.filter(isHuman).length;
    const nAuto = ALL.length - nHand;
    let items = DK === 'human' ? ALL.filter(isHuman) : ALL.filter(x => x.kind === 'machine');
    if (DST) items = items.filter(x => x.status === DST);
    const nD = items.filter(x => x.status === 'draft').length;
    const nC = items.filter(x => x.status === 'confirmed').length;
    const nR = items.filter(x => x.status === 'rejected').length;

    $('#main').innerHTML = `
      <h1>梦境</h1>
      <div class="sub">从最近的卡里提炼的判断 · 不是事实，是推断</div>
      ${DK === 'human'
        ? `<div class="grid" style="grid-template-columns:repeat(3,1fr)">
             <div class="stat a"><div class="v">${nD}</div><div class="k">待确认</div></div>
             <div class="stat g"><div class="v">${nC}</div><div class="k">已收下</div></div>
             <div class="stat"><div class="v">${nR}</div><div class="k">已否</div></div>
           </div>` : ''}
      <div style="display:flex;gap:10px;margin:14px 0 10px">
        <button class="chip ${DK==='human'?'on':''}" data-dk="human"
          style="flex:1;padding:16px 0;font-size:15px;border-radius:11px;border-color:var(--amber)">
          ✎ 人工梦 <b style="margin-left:6px">${nHand}</b></button>
        <button class="chip ${DK==='machine'?'on':''}" data-dk="machine"
          style="flex:1;padding:16px 0;font-size:15px;border-radius:11px;border-color:#5a4a7a">
          ☾ 机器梦 <b style="margin-left:6px">${nAuto}</b></button>
      </div>
      <div style="display:flex;gap:8px;margin:8px 0 6px;align-items:center">
        <input id="dq" placeholder="想问什么？留空＝盲抽（例：他的网络是怎么变的）"
          style="flex:1;min-width:0;background:#0f1216;border:1px solid var(--line);border-radius:9px;
          padding:11px 13px;color:var(--tx);font-size:13px;font-family:inherit">
      </div>
      <div style="display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;align-items:center">
        ${DK === 'human'
          ? '<button class="btn" id="mkDream">做梦</button><button class="chip" id="newHand">✎ 手写一条</button>'
          : '<button class="btn" id="mkMachine">机器梦</button>'}
        <button class="chip" id="mkMerge">⇄ 合并</button>
        <button class="chip" id="dgSet">⚙ 设置</button>
        ${['','draft','confirmed','rejected'].map(v=>`<button class="chip ${DST===v?'on':''}" data-dst="${v}">${v||'全部'}</button>`).join('')}
      </div>
      <div id="dset" style="display:none;background:#0f1216;border:1px solid #21262d;border-radius:9px;padding:14px 16px;margin-bottom:14px">
        <div style="font-size:12px;color:var(--tx3);margin-bottom:12px">梦境设置 · 改完点保存</div>
        <div class="sg">

      <div id="dlog" style="display:none;font:12px/1.6 ui-monospace,monospace;color:var(--tx2);background:#0f1216;border:1px solid #21262d;border-radius:7px;padding:10px 12px;margin-bottom:14px;white-space:pre-wrap"></div>
      <div id="dlist">${items.length ? '' : (DK === 'human'
        ? '<div class="empty">还没有人工梦。点「做梦」，让它读最近 90 天的卡；也可以「手写一条」。</div>'
        : '<div class="empty">还没有机器梦。点「机器梦」，让它读自己做过的 63 件事。</div>')}</div>`;

    const box = $('#dlist');
    if (items.length){
      box.innerHTML = items.map(x => `
        <div class="dream ${x.status}">
          <div class="dtitle">${esc(x.title)}</div>
          <div class="dbody">${esc(x.body)}</div>
          <div class="dmeta">
            ${x.span ? `<span class="tag">${esc(x.span)}</span>` : ''}
            ${x.evidence ? `<span class="tag ev">证据 ${parseEv(x.evidence).map(i=>`<a class="evid" href="#search" onclick="window.__card=${i}">${i}</a>`).join('')}</span>` : ''}
            <span class="tag ${x.status}">${x.status}</span>
            ${(x.kind === 'machine') ? '<span class="tag" style="background:#2a2140;color:#b79cf0">机器梦</span>' : ''}
            <span style="color:var(--tx3)">${esc(x.at)}</span>
            <span style="margin-left:auto;display:flex;gap:6px">
              ${x.status !== 'confirmed' ? `<button class="chip" data-sid="${x.id}" data-st="confirmed">收下</button>` : ''}
              ${x.status !== 'rejected' ? `<button class="chip no" data-sid="${x.id}" data-st="rejected">不要</button>` : ''}
            </span>
          </div>
          ${x.note ? `<div class="dnote">${esc(x.note)}</div>` : ''}
        </div>`).join('');
    }

    let SET = null;
    const fillSet = (v) => {
      $('#s_enabled').value = v['dream.enabled'] === '1' ? '1' : '0';
      $('#s_auto').value    = v['dream.auto_confirm'] === '1' ? '1' : '0';
      $('#s_days').value    = v['dream.days'];
      $('#s_per').value     = v['dream.per_run'];
      $('#s_cats').value    = v['dream.max_cats'];
      $('#s_cpc').value     = v['dream.cards_per_cat'];
      $('#s_cron').value    = v['dream.cron'];
      if ($('#s_mcron')) $('#s_mcron').value = v['dream.machine_cron'] || '';
      if ($('#s_inj')) $('#s_inj').value = v['inject.enabled'] || '1';
      if ($('#s_fcron')) $('#s_fcron').value = v['focus.cron'] || '';
      if ($('#s_fhrs')) $('#s_fhrs').value = v['focus.hours'] || '';
      $('#s_api').value     = v['llm.base']   || v['dream.api_base'] || '';
      $('#s_key').value     = v['llm.key']    || v['dream.api_key'] || '';
      $('#s_model').value   = v['llm.model']  || v['dream.model'];
      // 各功能覆盖项
      const FEATS = [['dream','人工梦'],['machine','机器梦'],['summary','知识摘要'],
                     ['procedure','程序记忆'],['focus','焦点重建'],['digest','会话压缩']];
      $('#featbox').innerHTML = FEATS.map(([k,lab]) => `
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:var(--tx2);margin-bottom:6px">${lab}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <input type="text" class="fb" data-f="${k}" data-k="base"  placeholder="API 地址（留空继承）" value="${(v['llm.'+k+'.base']||'').replace(/"/g,'&quot;')}">
            <input type="text" class="fb" data-f="${k}" data-k="model" placeholder="模型（留空继承）" value="${(v['llm.'+k+'.model']||'').replace(/"/g,'&quot;')}">
          </div>
          <input type="text" class="fb" data-f="${k}" data-k="key" placeholder="密钥（留空继承）" style="margin-top:6px;width:100%" value="${(v['llm.'+k+'.key']||'').replace(/"/g,'&quot;')}">
        </div>`).join('');
    };
    const $on = (sel, fn) => { const e = $(sel); if (e) e.onclick = fn; };
    $on('#mkMerge', async () => {
      const b = $('#mkMerge'), log = $('#dlog');
      b.disabled = true; b.textContent = '分析中… 0s';
      const t0 = Date.now();
      const tick = setInterval(() => { b.textContent = '分析中… ' + Math.round((Date.now()-t0)/1000) + 's'; }, 1000);
      log.style.display = 'block'; log.style.color = 'var(--tx2)';
      log.textContent = '先算语义相似度，再逐对问模型：是不是同一件事。';
      if (MERGE_HTML) { log.innerHTML = MERGE_HTML; log.style.color = MERGE_CLR; }
      try {
        const r = await api('/dream/merge', 'POST', { kind: DK, apply: true });
        const ps = (r && r.pairs) || [];
        if (!ps.length) { log.textContent = '没有够像的两条，不用合。'; }
        else {
          const merged = ps.filter(x => x.same), kept = ps.length - merged.length;
          log.style.color = merged.length ? 'var(--green)' : 'var(--tx2)';
          MERGE_HTML = '看了 ' + ps.length + ' 对：合成 <b>' + merged.length + '</b> 条，判为不同保留 <b>' + kept + '</b> 对。<br>' +
            ps.map(x => (x.same ? '✓ 合了《' + esc(x.title || x.a) + '》'
                                : '— 不同：' + esc((x.a||'').slice(0,18)) + ' / ' + esc((x.b||'').slice(0,18)))).join('<br>');
          MERGE_CLR = merged.length ? 'var(--green)' : 'var(--tx2)';
          log.innerHTML = MERGE_HTML; log.style.color = MERGE_CLR;
        }
      } catch (e) { MERGE_HTML = '出错：' + esc(e.message); MERGE_CLR = 'var(--red)';
                    log.style.color = MERGE_CLR; log.textContent = MERGE_HTML; }
      clearInterval(tick);
      b.disabled = false; b.textContent = '⇄ 合并';
      await viewDream();
    });

    $on('#dgSet', async () => {
      const box = $('#dset');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
      if (box.style.display === 'block' && !SET){
        try{ SET = await j('/settings'); fillSet(SET.items); }
        catch(e){ $('#smsg').textContent = '读设置失败：' + e; }
      }
    });
    $on('#mLang', async () => {
      const btn = $('#mLang'), msg = $('#smsg');
      btn.disabled = true; btn.textContent = '…'; msg.style.color = 'var(--tx3)'; msg.textContent = '拉取模型列表…';
      try{
        // 先把当前填的 api/key 暂存，用它们去拉
        await fetch('/settings', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({'dream.api_base': $('#s_api').value.trim(),
                                'dream.api_key':  $('#s_key').value.trim()})});
        const r = await fetch('/models'); const d = await r.json();
        if (!r.ok) throw new Error(d.detail || d.error || r.status);
        const ids = d.items || [];
        if (!ids.length) throw new Error('返回空列表');
        msg.textContent = '共 ' + ids.length + ' 个：' + ids.join(', ');
        msg.style.color = 'var(--green)';
        const cur = $('#s_model').value;
        if (!ids.includes(cur)) $('#s_model').value = ids[0];
      }catch(e){ msg.textContent = '拉取失败：' + e; msg.style.color = 'var(--red)'; }
      btn.disabled = false; btn.textContent = '拉取';
    });

    $on('#dSave', async () => {
      const btn = $('#dSave'), msg = $('#smsg');
      btn.disabled = true; msg.textContent = '保存中…';
      const body = {
        'dream.enabled': $('#s_enabled').value,
        'dream.auto_confirm': $('#s_auto').value,
        'dream.days': $('#s_days').value,
        'dream.per_run': $('#s_per').value,
        'dream.max_cats': $('#s_cats').value,
        'dream.cards_per_cat': $('#s_cpc').value,
        'dream.cron': $('#s_cron').value.trim(),
        'dream.machine_cron': ($('#s_mcron') || {}).value ? $('#s_mcron').value.trim() : '',
        'inject.enabled': ($('#s_inj') || {}).value || '1',
        'focus.cron': ($('#s_fcron') || {}).value ? $('#s_fcron').value.trim() : '',
        'focus.hours': ($('#s_fhrs') || {}).value ? $('#s_fhrs').value.trim() : '',
        'llm.base':  $('#s_api').value.trim(),
        'llm.key':   $('#s_key').value.trim(),
        'llm.model': $('#s_model').value.trim(),
        ...Object.fromEntries([...document.querySelectorAll('.fb')].map(el =>
            ['llm.' + el.dataset.f + '.' + el.dataset.k, el.value.trim()])),
        'dream.model': $('#s_model').value.trim()
      };
      try{
        const r = await fetch('/settings', {method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify(body)});
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.status);
        SET = {items: d.items};
        msg.textContent = '已保存 ' + d.saved + ' 项'
          + (d.timer ? (d.timer.ok ? ' · 定时器已更新为 ' + d.timer.value : ' · 定时器更新失败：' + d.timer.value) : '');
        msg.style.color = d.timer && !d.timer.ok ? 'var(--red)' : 'var(--green)';
      }catch(e){ msg.textContent = '保存失败：' + e; msg.style.color = 'var(--red)'; }
      btn.disabled = false;
    });

    /* ── 做梦按钮：两段式确认，防误触 ── */
    const MK = {human: 0, machine: 0};
    let MERGE_HTML = '', MERGE_CLR = 'var(--tx2)';
    const mkt = {human: 0, machine: 0};
    const btnOf = k => $(k === 'machine' ? '#mkMachine' : '#mkDream');
    const labelOf = k => (k === 'machine' ? '机器梦' : '做梦');

    const mkReset = (k) => {
      MK[k] = 0; clearTimeout(mkt[k]);
      const b = btnOf(k);
      if (b){ b.textContent = labelOf(k); b.classList.remove('danger'); }
    };

    const arm = (kind, b) => {
      if (MK[kind] !== 1){
        MK[kind] = 1;
        b.textContent = '再点一次确认';
        b.classList.add('danger');
        const log = $('#dlog');
        log.style.display = 'block'; log.style.color = 'var(--amber)';
        log.textContent = kind === 'machine'
          ? '会调一次大模型，读「助手自己做过的 63 件事」，生成关于它自己的判断。再点一次才真的跑，4 秒不动自动取消。'
          : '会调一次大模型、生成新卡。再点一次「再点一次确认」才真的跑，4 秒不动自动取消。';
        mkt[kind] = setTimeout(() => mkReset(kind), 4000);
        return false;
      }
      clearTimeout(mkt[kind]); MK[kind] = 2;
      return true;
    };

    const fire = async (kind) => {
      const b = btnOf(kind), log = $('#dlog');
      if (!arm(kind, b)) return;
      const q = ((($('#dq') || {}).value || '')).trim();
      log.style.color = '';
      b.disabled = true; b.textContent = '在想…';
      log.style.display = 'block';
      log.textContent = kind === 'machine'
        ? '读助手自己做过的那些事……'
        : (q ? '按问题找相关卡：' + q : '取最近 90 天的卡，按主题分组……');
      try{
        const r = await fetch('/dream/run', {method:'POST', headers:{'Content-Type':'application/json'},
                                            body: JSON.stringify({apply:true, kind: kind, query: q || null})});
        const d = await r.json();
        if (!r.ok) throw new Error((d.error || r.status) + ' ' + (d.detail || ''));
        log.textContent = d.query
          ? `问题「${d.query}」· 命中 ${d.cards} 张卡 · LLM ${d.total_s}s
产出 ${d.parsed} 条，入库 ${d.saved} 条`
          : (kind === 'machine'
            ? `素材 ${d.cards} 张卡 · LLM ${d.total_s}s
产出 ${d.parsed} 条，入库 ${d.saved} 条`
            : `分组 ${d.groups} · 卡片 ${d.cards} · LLM ${d.total_s}s
产出 ${d.parsed} 条，入库 ${d.saved} 条`);
        setTimeout(() => viewDream(), 1200);
      }catch(e){ log.textContent = '失败：' + e; log.style.color = 'var(--red)'; }
      b.disabled = false; mkReset(kind);
    };

    $on('#newHand', () => {
      const box = $('#hset');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    });
    $on('#hSave', async () => {
      const msg = $('#hmsg'), btn = $('#hSave');
      const title = $('#h_title').value.trim(), body = $('#h_body').value.trim();
      if (!title || !body){ msg.style.color = 'var(--red)'; msg.textContent = '标题和正文都要填'; return; }
      btn.disabled = true; msg.style.color = 'var(--tx3)'; msg.textContent = '保存中…';
      try{
        const r = await fetch('/dreams/new', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({title, body, span: $('#h_span').value.trim()})});
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || r.status);
        msg.style.color = 'var(--green)'; msg.textContent = '已保存，正在刷新…';
        $('#h_title').value = ''; $('#h_body').value = ''; $('#h_span').value = '';
        setTimeout(() => viewDream(), 500);
      }catch(e){ msg.style.color = 'var(--red)'; msg.textContent = '保存失败：' + e; }
      btn.disabled = false;
    });
    $on('#mkDream', () => fire('human'));
    $on('#mkMachine', () => fire('machine'));
  }catch(e){
    $('#main').innerHTML = `<h1>梦境</h1><div class="sub">读取出错：${esc(String(e))}</div>`;
  }
}

document.addEventListener('click', async e => {
  // 焦点页：标完成
  const tb = e.target.closest('[data-ftab]');
  if (tb){ FTAB = tb.getAttribute('data-ftab'); await viewFocus(); return; }
  const fr = e.target.closest('[data-fr]');
  if (fr){ e.preventDefault(); const cid = fr.getAttribute('data-fr');
    try{ await fetch('/focus/reopen',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({conv_id:cid})}); await viewFocus(); }
    catch(err){ alert('失败：'+err.message); } return; }
  const fc = e.target.closest('[data-fc]');
  if (fc){ e.preventDefault(); const cid = fc.getAttribute('data-fc');
    if(!confirm('把这个会话的「还没做完」全部标为完成？')) return;
    try{ await fetch('/focus/close',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({conv_id:cid})}); await viewFocus(); }
    catch(err){ alert('失败：'+err.message); } return; }
  // 摘要页：重刷 / 删除
  const rf = e.target.closest('[data-srf]');
  if (rf){ e.preventDefault(); const q = rf.getAttribute('data-srf');
    const log = $('#slog'); if(log){log.style.display='block';log.style.color='var(--tx2)';log.textContent='重刷「'+q+'」中，约 20 秒…';}
    try{ await fetch('/summary/refresh',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,apply:true})}); await viewSumm(); }
    catch(err){ if(log){log.style.color='var(--red)';log.textContent='失败：'+err.message;} } return; }
  const dl = e.target.closest('[data-sdel]');
  if (dl){ e.preventDefault(); const q = dl.getAttribute('data-sdel');
    if(!confirm('删除摘要「'+q+'」？')) return;
    try{ await fetch('/summary/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})}); await viewSumm(); }
    catch(err){ alert('失败：'+err.message); } return; }
  const c = e.target.closest('button.chip');
  if (!c) return;
  if (c.dataset.dk !== undefined){
    DK = c.dataset.dk; DST = ''; viewDream(); return;
  }
  if (c.dataset.dst !== undefined){
    DST = c.dataset.dst; viewDream(); return;
  }
  if (c.dataset.sid){
    await fetch('/dreams/' + c.dataset.sid + '/status', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status: c.dataset.st})
    });
    viewDream();
  }
});

        <div style="color:var(--tx3);font-size:12px;margin-bottom:10px">

        </div>
        <div class="bar" style="margin-bottom:0">
          <input type="file" id="io-file" accept=".txt,text/plain" style="flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--tx);font-size:12.5px">
          <button class="btn" id="io-import">⬆️ 导入</button>
        </div>
        <div id="io-out" class="muted" style="margin-top:10px"></div>
      </div>
    `;
    const _dl = (u) => {
      const m = document.getElementById('io-msg');
      if (m) m.textContent = '生成中…';
      const a = document.createElement('a');
      a.href = u; a.download = '';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => { if (m) m.textContent = '已开始下载'; }, 900);
    };
    const _ea = document.getElementById('io-export-all');
    const _e1 = document.getElementById('io-export-100');
    const _bi = document.getElementById('io-import');
    const _fi = document.getElementById('io-file');
    const _out = document.getElementById('io-out');
    if (_ea) _ea.onclick = () => _dl('/export');
    if (_e1) _e1.onclick = () => _dl('/export?convs=100');
    if (_bi) _bi.onclick = async () => {
      const f = _fi && _fi.files && _fi.files[0];
      if (!f) { if (_out) _out.textContent = '先选一个 .txt 文件'; return; }
      if (_out) _out.textContent = '上传中…（' + Math.round(f.size/1024) + ' KB）';
      try {
        const buf = await f.arrayBuffer();
        const r = await fetch('/import', { method:'POST', headers:{'Content-Type':'text/plain; charset=utf-8'}, body: buf });
        const jj = await r.json();
        if (_out) _out.innerHTML = '<b>导入完成</b>：会话 ' + (jj.convs||0) + ' / 消息 ' + (jj.msgs||0)
          + ' / 跳过重复 ' + (jj.skipped_dup||0) + ' / 跳过噪声 ' + (jj.skipped_noise||0);
      } catch (e) { if (_out) _out.textContent = '失败：' + e.message; }
    };
    $('#foot').textContent = `${STATS.cards.toLocaleString()} 张卡 · ${STATS.evidence.toLocaleString()} 条证据`;
  }catch(e){ $('#main').innerHTML = err(e); }
}

async function viewSearch(q=''){
  const pend = window.__card || 0; window.__card = 0;
  $('#main').innerHTML = `
    <h1>记忆</h1>
    <div class="sub">搜卡片；点开看原文引用</div>
    <div class="bar">
      <input id="q" type="text" placeholder="8006 端口 / 傲腾 排障 / 我平时怎么学东西">
      <select id="kind">
        <option value="">全部类型</option>
        <option value="definition">定义</option>
        <option value="event">事件</option>
        <option value="experience">经验</option>
        <option value="preference">偏好</option>
        <option value="tool">工具</option>
      </select>
      <button id="go">搜索</button>
    </div>
    <div id="res"><div class="muted">输入关键词</div></div>`;
  $('#go').onclick = doSearch;
  $('#q').onkeydown = e => { if(e.key==='Enter') doSearch(); };

async function doSearch(){
  const q = $('#q').value.trim();
  if(!q) return;
  const kind = $('#kind').value;
  $('#res').innerHTML = '<div class="spin">搜索中…</div>';
  try{
    const d = await j(`/find?q=${encodeURIComponent(q)}&limit=20${kind?`&claim=`:''}`);
    const ms = d.memories || [];
    if(!ms.length){ $('#res').innerHTML = '<div class="muted">没有命中</div>'; return; }
    $('#res').innerHTML = ms.map(c=>`
      <div class="card" data-id="${c.card_id}">
        <div class="t">${esc(c.title)}</div>
        <div class="b">${esc(c.content||'')}</div>
        <div class="m">
          <span class="tag k">${KIND[c.kind]||c.kind||'—'}</span>
          ${c.topic?`<span class="tag">${esc(c.topic)}</span>`:''}
          ${c.claim_type==='plan'?'<span class="tag w">计划</span>':''}
          ${c.claim_type==='question'?'<span class="tag w">问题</span>':''}
          <span class="num">${(c.score||0).toFixed(3)}</span>
          ${(c.evidence&&c.evidence.length)?`<span class="tag s">原文 ${c.evidence.length}</span>`:''}
        </div>
      </div>`).join('');
    document.querySelectorAll('.card').forEach(el=>{
      el.onclick = () => showCard(el.dataset.id);
    });
  }catch(e){ $('#res').innerHTML = err(e); }
}
async function showCard(id){
  $('#res').innerHTML = '<div class="spin">读卡片…</div>';
  try{
    const d = await j(`/card/${id}/evidence`);
    const c = d.card || d;
    const evs = d.evidence || [];
    $('#res').innerHTML = `
      <button class="ghost" id="back">← 返回</button>
      <div class="detail" style="margin-top:12px">
        <h2>${esc(c.title)}</h2>
        <div class="m" style="margin-bottom:10px;display:flex;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--tx3)">
          <span class="tag k">${KIND[c.kind]||c.kind||'—'}</span>
          ${c.topic?`<span class="tag">${esc(c.topic)}</span>`:''}
          <span class="num">#${c.id}</span>
          ${c.related_card?`<a class="evid" href="#search" onclick="window.__card=${c.related_card}">同类有原文 #${c.related_card}</a>`:''}
        </div>
        <div class="body">${esc(c.body||c.content||'')}</div>
        ${evs.length?`<div class="ev"><div class="r">原文引用 ${evs.length} 条</div>
          ${evs.map(e=>`<div class="q">${esc(e.quote||'')}</div>
            <div class="r">${esc(e.role||'')} · ${esc((e.ts||'').slice(0,16))}</div>`).join('')}</div>`
          :(c.related_card
             ?`<div class="ev"><div class="r">这张卡没有自己的原文，但同样内容在 <a class="evid" href="#search" onclick="window.__card=${c.related_card}">#${c.related_card}</a> 里有</div></div>`
             :'<div class="ev muted">这张卡没有原文引用（旧卡，且库里没有同类卡）</div>')}
      </div>`;
    $('#back').onclick = doSearch;
  }catch(e){ $('#res').innerHTML = err(e); }
}

/* ── 编年史 ── */
async function viewChron(){
  $('#main').innerHTML = '<h1>编年史</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const list = (await j('/chron')).items || [];
    CHRON_N = list.length;
    const order = {core:0,year:1,quarter:2,month:3};
    list.sort((a,b)=> (order[a.granularity]-order[b.granularity]) || String(b.period_id).localeCompare(String(a.period_id)));
    const pick = list.find(x=>x.granularity==='core') || list[0];
    $('#main').innerHTML = `
      <h1>编年史</h1>
      <div class="sub">${list.length} 条 · 月 / 季 / 年 / 总纲</div>
      <div class="chron">${list.map(x=>
        `<span class="chip${x.period_id===pick.period_id?' on':''}" data-p="${esc(x.period_id)}">${esc(x.period_id)}</span>`
      ).join('')}</div>
      <div id="cbody"></div>`;
    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick = ()=>{
        document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
        c.classList.add('on');
        renderChron(c.dataset.p);
      };
    });
    renderChron(pick.period_id);
  }catch(e){ $('#main').innerHTML = err(e); }
}
async function renderChron(pid){
  $('#cbody').innerHTML = '<div class="spin">…</div>';
  try{
    const d = await j(`/chron/${encodeURIComponent(pid)}`);
    const turns = Array.isArray(d.turns) ? d.turns : [];
    $('#cbody').innerHTML = `
      <div class="detail">
        <h2>${esc(d.title||pid)}</h2>
        <div class="muted" style="margin-bottom:10px">${esc(pid)} · ${d.msg_count||0} 条消息 · ${esc((d.start_ts||'').slice(0,10))} → ${esc((d.end_ts||'').slice(0,10))}</div>
        <div class="body">${esc(d.summary||'')}</div>
        ${turns.length?`<div class="turns">${turns.map(t=>{
          const s = typeof t==='string' ? t : (t.note || t.name || JSON.stringify(t));
          return `<div class="turn">${esc(s)}</div>`;
        }).join('')}</div>`:''}
      </div>`;
  }catch(e){ $('#cbody').innerHTML = err(e); }
}

/* ── 程序性记忆 ── */
async function viewProc(){
  $('#main').innerHTML = '<h1>程序</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const d = await j('/procedures');
    const items = d.items || [];
    const byCat = {};
    items.forEach(x => (byCat[x.category || '未分类'] = byCat[x.category || '未分类'] || []).push(x));
    const cats = Object.keys(byCat).sort((a,b)=>byCat[b].length-byCat[a].length);
    $('#main').innerHTML = `
      <h1>程序</h1>
      <div class="sub">${items.length} 条 · 遇到这类问题他就这么做 · 从 event/experience 里抽的</div>
      <div class="tools">
        <button id="pRun">抽一轮</button>
        <span class="hint" id="pLog"></span>
      </div>
      ${cats.map(cat => `
        <h1 style="font-size:14px;margin:18px 0 8px">${esc(cat)}（${byCat[cat].length}）</h1>
        ${byCat[cat].map(x => `
          <div class="pcard">
            <div class="prow"><span class="pk">情境</span><div class="pv">${esc(x.situation)}</div></div>
            <div class="prow"><span class="pk">动作</span><div class="pv act">${esc(x.action)}</div></div>
            <div class="prow"><span class="pk">结果</span><div class="pv">${esc(x.result)}</div></div>
            <div class="pmeta">
              ${(x.evidence||[]).map(i=>`<a class="evid" href="#search" onclick="window.__card=${i}">${i}</a>`).join('')}
              <span class="tag st ${x.status}">${x.status}</span>
              <a class="dl" data-pid="${x.id}" data-st="confirmed">收下</a>
              <a class="dl" data-pid="${x.id}" data-st="rejected">不对</a>
            </div>
          </div>`).join('')}
      `).join('')}
    `;
    $('#pRun').onclick = async () => {
      const b = $('#pRun'), log = $('#pLog');
      b.disabled = true; b.textContent = '抽…'; log.textContent = '一轮约 4 分钟（6 个主题）';
      try{
        const r = await (await fetch('/procedure/run', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({apply:true})})).json();
        log.textContent = `已抽 ${r.results?.length || 0} 个主题，总耗时 ${r.total_s}s`;
        await viewProc();
      }catch(e){ log.textContent = '出错：' + e.message; }
      b.disabled = false; b.textContent = '抽一轮';
    };
  }catch(e){ $('#main').innerHTML = `<h1>程序</h1><div class="sub">读取出错：${esc(e.message)}</div>`; }
}

async function viewSumm(){
  const el = $('#main');
  const d = await (await fetch('/summaries')).json();
  const items = d.items || [];
  const stale = items.filter(x => x.is_stale).length;
  const rows = items.map(x => `
    <div class="scard">
      <div class="sq">${esc(x.query)}</div>
      <div class="sc">${esc(x.content || '（空）')}</div>
      <div class="sm">
        <span>${x.n_cards || 0} 张卡</span>
        <span>·</span>
        <span>${(x.refreshed_at||'').slice(0,16).replace('T',' ')}</span>
        ${x.is_stale ? '<span class="stale">· 已过期</span>' : ''}
        <a href="#" data-srf="${esc(x.query)}" style="color:var(--blue);text-decoration:none">重刷</a>
        <a href="#" data-sdel="${esc(x.query)}" style="color:var(--red);text-decoration:none">删除</a>
      </div>
    </div>`).join('');
  el.innerHTML = `
    <h2>摘要</h2>
    <div class="sub">按问题生成的持久化知识总结 · 可刷新 · 与「梦境」的区别是它是一段回答，不是一句判断</div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><a>${items.length}</a><b>摘要</b></div>
      <div class="stat"><a style="color:var(--amber)">${stale}</a><b>已过期</b></div>
      <div class="stat"><a style="color:var(--green)">${items.reduce((a,x)=>a+(x.n_cards||0),0)}</a><b>累计引用</b></div>
    </div>
    <div style="display:flex;gap:10px;margin:16px 0">
      <input id="sq" placeholder="想问什么？（例：他的网络是怎么变的）" style="flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--tx);font-size:14px">
      <button id="sRun" class="btn">生成</button>
      <button id="sAll" class="btn ghost">刷新全部过期</button>
    </div>
    <div id="slog" class="hint" style="display:none"></div>
    ${rows || '<div class="hint">还没有摘要。上面输入一个问题，点生成。</div>'}`;

  const log = $('#slog');
  const run = async (q) => {
    const b = $('#sRun');
    b.disabled = true; b.textContent = '生成中…';
    log.style.display='block'; log.style.color='var(--tx2)'; log.textContent = '调模型、取卡、生成中，约 20 秒…';
    try{
      const r = await (await fetch('/summary/refresh', {method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({query:q, apply:true})})).json();
      if (r.ok) { await viewSumm(); }
      else { log.style.color='var(--red)'; log.textContent = '失败：' + (r.error||JSON.stringify(r)); }
    }catch(e){ log.style.color='var(--red)'; log.textContent='失败：'+e.message; }
    finally{ if(b){b.disabled=false;b.textContent='生成';} }
  };
  $('#sRun').onclick = () => { const q = ($('#sq').value||'').trim(); if(!q) return; run(q); };
  $('#sq').onkeydown = (e) => { if(e.key==='Enter') $('#sRun').click(); };
  $('#sAll').onclick = async () => {
    const b = $('#sAll'); b.disabled=true; b.textContent='刷新中…';
    log.style.display='block'; log.style.color='var(--tx2)'; log.textContent='逐个刷新过期摘要，可能要几分钟…';
    try{ await fetch('/summary/refresh', {method:'POST', headers:{'content-type':'application/json'}, body:'{"apply":true}'}); await viewSumm(); }
    catch(e){ log.style.color='var(--red)'; log.textContent='失败：'+e.message; }
    finally{ b.disabled=false; b.textContent='刷新全部过期'; }
  };
}

let FTAB = 'open';
async function viewFocus(){
  $('#main').innerHTML = '<h1>任务</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const [dOpen, dDone] = await Promise.all([j('/focus?status=open'), j('/focus?status=done')]);
    const items = (FTAB === 'done' ? (dDone.items||[]) : (dOpen.items||[]));
    const nOpen = (dOpen.items||[]).length, nDone = (dDone.items||[]).length;
    $('#main').innerHTML = `
      <h1>任务</h1>
      <div class="sub">${nOpen} 件没做完 · ${nDone} 件已完成 · 每 2 小时重建一次</div>
      <div class="tools">
        <button id="fRun">重建最近的</button><span class="hint" id="fLog"></span>
      </div>
      <div class="chips" style="margin:10px 0 14px">
        <button class="chip${FTAB==='open'?' on':''}" data-ftab="open">未完成 ${nOpen}</button>
        <button class="chip${FTAB==='done'?' on':''}" data-ftab="done">已完成 ${nDone}</button>
      </div>
      ${items.map(x => FTAB === 'done' ? `
        <div class="fcard done">
          <div class="ftop"><span class="fdot done"></span><span class="fti">${esc(x.topic)}</span></div>
          ${(x.done_items||[]).length ? `<div class="frow"><span class="fk done">已完成</span><div>${(x.done_items||[]).map(o=>esc(o)).join('；')}</div>
            <a href="#" class="freopen" data-fr="${esc(x.conv_id||'')}">撤销</a></div>` : ''}
          <div class="fmeta">${esc(x.conv_id || '')} · ${(x.done_at||x.last_ts||'').slice(0,16)} · ${x.n_spans} 条</div>
        </div>` : `
        <div class="fcard">
          <div class="ftop"><span class="fdot"></span><span class="fti">${esc(x.topic)}</span></div>
          ${(x.open_items||[]).length ? `<div class="frow"><span class="fk">还没做完</span><div>${(x.open_items||[]).map(o=>esc(o)).join('；')}</div>
            <a href="#" class="fclose" data-fc="${esc(x.conv_id||'')}">标完成</a></div>` : ''}
          <div class="fmeta">${esc(x.conv_id || '')} · ${(x.last_ts||'').slice(0,16)} · ${x.n_spans} 条</div>
        </div>`).join('') || '<div class="sub">（这一类还没有）</div>'}
    `;
    $('#fRun').onclick = async () => {
      const b = $('#fRun'), log = $('#fLog');
      b.disabled = true; b.textContent = '重建…'; log.textContent = '每个会话约 20 秒';
      try{
        const r = await (await fetch('/focus/build', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({hours:72, apply:true, limit:10})})).json();
        log.textContent = `重建 ${r.convs || 0} 个会话`;
        await viewFocus();
      }catch(e){ log.textContent = '出错：' + e.message; }
      b.disabled = false; b.textContent = '重建最近的';
    };
  }catch(e){ $('#main').innerHTML = `<h1>焦点</h1><div class="sub">读取出错：${esc(e.message)}</div>`; }
}

async function viewThreads(){
  $('#main').innerHTML = '<h1>线索</h1><div class="sub">正在读…</div><div class="spin">…</div>';
  try{
    const all = await j('/threads?limit=300');
    const groups = [
      ['blocked','卡住的'],['active','进行中'],['shifted','转向了'],['done','完成']
    ];
    $('#main').innerHTML = `
      <h1>线索</h1>
      <div class="sub">${all.length} 条 · 从编年史抽出来的</div>
      ${groups.map(([st,label])=>{
        const items = all.filter(t=>t.state===st);
        if(!items.length) return '';
        return `<h1 style="font-size:14px;margin:16px 0 8px">${label}（${items.length}）</h1>` +
          items.map(t=>`
            <div class="thread">
              <span class="dot ${st}"></span>
              <div class="nm">${esc(t.name)}
                <div class="nt">${esc(t.note||'')} · 最后 ${esc(t.last)}${t.seen>1?` · ${t.seen} 次`:''}</div>
              </div>
            </div>`).join('');
      }).join('')}`;
  }catch(e){ $('#main').innerHTML = err(e); }
}

function err(e){ return `<div class="muted">出错了：${esc(String(e.message||e))}</div>`; }

nav((location.hash||'#home').slice(1));
