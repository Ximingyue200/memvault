<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>cradle · 3D 记忆图</title>
<style>
:root{--bg:#06070a;--tx:#e6e9ef;--tx2:#8b95a5;--line:#1b2027}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;
  font:13px/1.5 -apple-system,"PingFang SC",sans-serif;
  user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;touch-action:none}
#img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  max-width:100%;max-height:100%;image-rendering:auto;will-change:transform}

.hud{position:fixed;left:12px;top:12px;background:rgba(14,17,22,.86);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);max-width:190px}
.hud a{color:var(--tx2);text-decoration:none;font-size:11px}
.hud h1{margin:5px 0 2px;font-size:13px;font-weight:600}
.hud .s{color:var(--tx2);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:10.5px;color:var(--tx2);margin-top:7px}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%}

.hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#4b5563;font-size:11px;
  pointer-events:none}
#spin{position:fixed;right:12px;top:12px;background:rgba(14,17,22,.85);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:11px;color:var(--tx2);opacity:0;transition:opacity .2s}
#spin.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><img id="img" alt=""></div>

<div class="hud">
  <a href="/admin">← 返回</a>
  <h1>cradle 3D</h1>
  <div class="s" id="stat">—</div>
  <div class="legend" id="legend"></div>
</div>
<div id="spin">渲染中…</div>
<div class="hint">拖动旋转 · 双指缩放</div>

<script>
const img = document.getElementById('img');
const spin = document.getElementById('spin');
let yaw = 0.0, pitch = 0.25, zoom = 1.0;
let W = 900, H = 1200;
let pending = null, busy = false, lastT = 0;

function pickSize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(window.innerWidth * dpr);
  const h = Math.round(window.innerHeight * dpr);
  // 拖动时降低分辨率，松手再拉高
  return { w: Math.min(w, 1400), h: Math.min(h, 1800) };
}

function url(quality){
  const s = pickSize();
  const w = quality ? s.w : Math.round(s.w * 0.55);
  const h = quality ? s.h : Math.round(s.h * 0.55);
  return `/snap3d?yaw=${yaw.toFixed(3)}&pitch=${pitch.toFixed(3)}` +
         `&w=${w}&h=${h}&zoom=${zoom.toFixed(2)}&limit=4000&t=${Date.now()}`;
}

function load(quality=true){
  if(busy){ pending = quality; return; }
  busy = true;
  if(!quality) spin.classList.add('on');
  const u = url(quality);
  const im = new Image();
  im.onload = () => {
    img.src = u;
    W = im.naturalWidth; H = im.naturalHeight;
    if(quality) spin.classList.remove('on');
    busy = false;
    if(pending !== null){ const q = pending; pending = null; load(q); }
  };
  im.onerror = () => { busy = false; spin.classList.remove('on'); };
  im.src = u;
}

/* 手势 */
let drag = null;
const stage = document.getElementById('stage');

stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, yaw, pitch };
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if(!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  yaw = drag.yaw + dx * 0.008;
  pitch = Math.max(-1.45, Math.min(1.45, drag.pitch + dy * 0.006));
  const t = performance.now();
  if(t - lastT > 90){ lastT = t; load(false); }
});
stage.addEventListener('pointerup', () => {
  if(!drag) return;
  drag = null;
  load(true);
});
stage.addEventListener('pointercancel', () => { drag = null; load(true); });

/* 双指缩放 */
let pinch = null;
stage.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: zoom };
  }
}, {passive:true});
stage.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinch){
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    zoom = Math.max(0.5, Math.min(3.0, pinch.z * (d / pinch.d)));
    if(performance.now() - lastT > 90){ lastT = performance.now(); load(false); }
  }
}, {passive:true});
stage.addEventListener('touchend', e => {
  if(e.touches.length < 2 && pinch){ pinch = null; load(true); }
}, {passive:true});

/* 图例 + 计数 */
(async function(){
  try{
    const r = await fetch('/graph3d?limit=4000');
    const d = await r.json();
    const kinds = {};
    d.nodes.forEach(n => kinds[n.group] = (kinds[n.group]||0)+1);
    const COL = {fact:'#5aa9ff',definition:'#4dabf7',event:'#ffc857',experience:'#ff8fab',
                 preference:'#b48cff',tool:'#5fd48a',note:'#dfe3ea',rule:'#ff6b6b'};
    const NAME = {definition:'定义',fact:'事实',event:'事件',experience:'经验',
                  preference:'偏好',tool:'工具',note:'笔记',rule:'规则'};
    document.getElementById('stat').textContent = `${d.nodes.length.toLocaleString()} 个点`;
    document.getElementById('legend').innerHTML = Object.entries(kinds)
      .sort((a,b)=>b[1]-a[1])
      .map(([k,v])=>`<span><i class="dot" style="background:${COL[k]||'#888'}"></i>${NAME[k]||k} ${v}</span>`)
      .join('');
  }catch(e){}
  load(true);
})();
</script>
</body>
</html>
