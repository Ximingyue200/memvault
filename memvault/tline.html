<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>cradle · 时间线</title>
<link href="https://unpkg.com/vis-timeline@8.0.0/styles/vis-timeline-graph2d.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%;background:#0d0f12;color:#e6e9ef;overflow:hidden;
  font:14px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;touch-action:pan-y}
#c{position:absolute;inset:100px 0 0 0;background:#0d0f12}
.hud{position:absolute;left:0;right:0;top:0;height:100px;background:#14171c;
  border-bottom:1px solid #242931;z-index:9;padding:8px 12px 0}
.hud .r1{display:flex;align-items:center;gap:8px}
.hud b{color:#5aa9ff;font-size:15px}
.hud .s{color:#6b7280;font-size:11px;flex:1;min-width:0;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis}
.lv{display:flex;gap:6px;margin-top:8px}
.lv b{flex:1;text-align:center;padding:7px 0;border-radius:8px;background:#1c2027;
  border:1px solid #2a2f39;color:#9aa3b0;font-size:13px;font-weight:500;cursor:pointer;
  color:#9aa3b0!important}
.lv b.on{background:#5aa9ff;border-color:#5aa9ff;color:#08121e!important;font-weight:600}
.vis-timeline{border:0!important;background:#0d0f12!important}
.vis-panel.vis-center,.vis-panel.vis-left,.vis-panel.vis-top{border-color:#242931!important}
.vis-labelset .vis-label{color:#9aa3b0!important;border-color:#242931!important;
  background:#14171c!important;font-size:12px}
.vis-time-axis .vis-text{color:#6b7280!important;font-size:11px}
.vis-time-axis .vis-grid.vis-minor{border-color:#171a1f!important}
.vis-time-axis .vis-grid.vis-major{border-color:#242931!important}
.vis-item{border-radius:5px!important;border-width:0!important;font-size:10.5px!important;
  color:#08121e!important;padding:0 4px!important}
.vis-item .vis-item-content{padding:0!important;line-height:1.35;white-space:nowrap}
</style>
</head>
<body>
<div class="hud">
  <div class="r1"><b>cradle</b><span class="s" id="sub">读…</span></div>
  <div class="lv" id="lv">
    <b data-l="year" class="on">年</b>
    <b data-l="month">月</b>
    <b data-l="week">周</b>
    <b data-l="day">日</b>
  </div>
</div>
<div id="c"></div>
<script src="https://unpkg.com/vis-timeline@8.0.0/standalone/umd/vis-timeline-graph2d.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const CO = {year:'#5aa9ff', month:'#5fd48a', week:'#ffc857', day:'#ff8fab'};
const G = {
  year: {id:'g-year', content:'年', order:0},
  month:{id:'g-month',content:'月', order:1},
  week: {id:'g-week', content:'周', order:2},
  day:  {id:'g-day',  content:'日', order:3},
};
let TL = null, YEAR=[], MONTH=[], WEEK=[], DAY=[], TOTAL=0;

fetch('/tree?by=time&per=40').then(r=>r.json()).then(d => {
  TOTAL = d.n;
  (d.children||[]).forEach(y => {
    YEAR.push({id:y.id, group:'g-year', content:`${y.name}  ${y.n}`,
      start:`${y.name}-01-01`, end:`${y.name}-12-31`, type:'range',
      style:`background:${CO.year}`});
    (y.children||[]).forEach(m => {
      MONTH.push({id:m.id, group:'g-month', content:`${Number(m.name.slice(5))}月 ${m.n}`,
        start:`${m.name}-01`, type:'box', style:`background:${CO.month}`});
      (m.children||[]).forEach(w => {
        const dt = new Date(`${m.name}-01`); dt.setDate(dt.getDate() + (w.week-1)*7);
        WEEK.push({id:w.id, group:'g-week', content:`W${w.week} ${w.n}`,
          start:dt, type:'box', style:`background:${CO.week}`});
        (w.children||[]).forEach(dd => {
          DAY.push({id:dd.id, group:'g-day', content:`${dd.name} ${dd.n}`,
            start:dd.day, type:'box', style:`background:${CO.day}`});
        });
      });
    });
  });

  TL = new vis.Timeline($('#c'), [], [G.year], {
    stack:false, showCurrentTime:false,
    zoomable:false, moveable:true,            // 关掉手势缩放，用按钮
    start: `${(d.children[0]||{}).name||'2025'}-01-01`, end: new Date(),
    locale:'zh',
    margin:{item:{horizontal:4, vertical:3}},
    format:{
      minorLabels:{day:'D日', weekday:'D日', month:'M月', year:'YYYY'},
      majorLabels:{day:'YYYY年M月', month:'YYYY年', year:''},
    },
  });

  function setLevel(l){
    const map = {
      year:  {gs:[G.year],                              its:YEAR,  span:'full'},
      month: {gs:[G.year,G.month],                      its:YEAR.concat(MONTH), span:'full'},
      week:  {gs:[G.year,G.month,G.week],               its:YEAR.concat(MONTH,WEEK), span:'month'},
      day:   {gs:[G.year,G.month,G.week,G.day],         its:YEAR.concat(MONTH,WEEK,DAY), span:'week'},
    };
    const c = map[l];
    TL.setGroups(c.gs);
    TL.setItems(c.its);
    document.querySelectorAll('#lv b').forEach(b=>b.classList.toggle('on', b.dataset.l===l));
    if(l==='year')      TL.setWindow(`${(d.children[0]||{}).name||'2025'}-01-01`, new Date(), {animation:true});
    else if(l==='month')TL.setWindow(`${(d.children[0]||{}).name||'2025'}-01-01`, new Date(), {animation:true});
    else {
      // 周/日：聚焦到最近一个月 / 最近一周
      const now = new Date();
      const back = l==='week' ? 45 : 10;
      TL.setWindow(new Date(now.getTime()-back*864e5), now, {animation:true});
    }
    $('#sub').textContent = `${TOTAL.toLocaleString()} 张 · ${c.its.length} 个块 · 当前看「${l==='year'?'年':l==='month'?'月':l==='week'?'周':'日'}」`;
  }

  document.querySelectorAll('#lv b').forEach(b =>
    b.addEventListener('click', () => setLevel(b.dataset.l)));

  setLevel('year');
}).catch(e => { $('#sub').textContent = '出错：' + e.message; });

addEventListener('resize', () => TL && TL.redraw());
</script>
</body>
</html>
