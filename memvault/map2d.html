<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>cradle 记忆图（2D）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#c9d1d9;
    font:13px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif;overflow:hidden;
    -webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:10px;top:10px;background:rgba(16,19,26,.92);
    border:1px solid #232936;border-radius:10px;padding:8px 10px;
    font-size:11.5px;line-height:1.7;backdrop-filter:blur(6px);max-width:60vw}
  #hud b{color:#7cc4ff;font-weight:600}
  #hud .k{display:inline-block;width:9px;height:9px;border-radius:50%;
    margin-right:5px;vertical-align:middle}
  #panel{position:fixed;left:10px;right:10px;bottom:10px;
    background:rgba(16,19,26,.96);border:1px solid #232936;border-radius:12px;
    padding:12px 14px;max-height:42vh;overflow:auto;display:none;
    backdrop-filter:blur(8px)}
  #panel h3{margin:0 0 6px;font-size:14px;color:#e6edf3}
  #panel .meta{color:#6b7684;font-size:11.5px;margin-bottom:8px}
  #panel .body{white-space:pre-wrap;color:#adb7c3;font-size:12.5px}
  #panel .close{position:absolute;right:12px;top:10px;color:#6b7684;
    font-size:18px;cursor:pointer;padding:2px 6px}
  #tip{position:fixed;right:10px;bottom:12px;color:#3d4654;font-size:11px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div><b id="cnt">0</b> 个节点 · <b id="vtxt">0</b> 可见</div>
  <div id="legend"></div>
</div>

<div id="panel">
  <span class="close" onclick="hidePanel()">×</span>
  <h3 id="p-title"></h3>
  <div class="meta" id="p-meta"></div>
  <div class="body" id="p-body"></div>
</div>

<div id="tip">双指缩放 · 单指拖动 · 点节点看详情</div>

<script>
const COLORS = {
  definition:"#4dabf7", fact:"#4dabf7", preference:"#c77dff",
  event:"#ffd43b", tool:"#69db7c", experience:"#ff8fab",
  note:"#e0e0e0", rule:"#ff6b6b", archive:"#4b5563", chronicle:"#00d4ff"
};
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let off = document.createElement("canvas");     // 离屏：所有点画一次
let octx = off.getContext("2d");

let DATA = [];        // {id,x,y,kind,title,topic,ym}
let VIEW = {x:0, y:0, s:1};   // 平移缩放
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0;

// ---------- 加载 ----------
async function load() {
  const r = await fetch("/map2d");
  DATA = await r.json();
  document.getElementById("cnt").textContent = DATA.length;
  buildLegend();
  resize();
  render();
}

function buildLegend() {
  const seen = {};
  DATA.forEach(d => seen[d.kind] = (seen[d.kind] || 0) + 1);
  const el = document.getElementById("legend");
  el.innerHTML = Object.entries(seen)
    .sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([k, n]) => `<span class="k" style="background:${COLORS[k] || "#888"}"></span>${k} ${n}`)
    .join("<br>");
}

// ---------- 尺寸 ----------
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  off.width = W * DPR; off.height = H * DPR;
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bake();
}

// ---------- 离屏烘焙：所有点只画一次 ----------
let SCALE = 0, CX = 0, CY = 0, R = 0;
function bake() {
  R = Math.min(W, H) * 0.46;
  SCALE = R;                       // x∈[-1,1] → 像素
  CX = W / 2; CY = H / 2;

  octx.clearRect(0, 0, W, H);
  // 底纹：极淡的同心圆，表示时间由内而外
  octx.strokeStyle = "rgba(120,140,180,.05)";
  octx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    octx.beginPath();
    octx.arc(CX, CY, R * i / 4, 0, 6.2832);
    octx.stroke();
  }

  // 点：按 kind 批量上色，减少状态切换
  const byKind = {};
  DATA.forEach(d => (byKind[d.kind] = byKind[d.kind] || []).push(d));

  for (const [kind, arr] of Object.entries(byKind)) {
    octx.fillStyle = COLORS[kind] || "#8b949e";
    for (const d of arr) {
      const px = CX + d.x * SCALE;
      const py = CY + d.y * SCALE;
      const s = d.kind === "definition" ? 1.7 : 1.35;
      octx.fillRect(px - s / 2, py - s / 2, s, s);
    }
  }
  octx.globalAlpha = 1;
}

// ---------- 主渲染：只做 drawImage ----------
let raf = null;
function render() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = null;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#0b0d12";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(VIEW.x, VIEW.y);
    ctx.scale(VIEW.s, VIEW.s);
    ctx.drawImage(off, 0, 0, W, H);   // 注意：off 已被 DPR 缩放
    ctx.restore();
    document.getElementById("vtxt").textContent = Math.round(VIEW.s * 100) + "%";
  });
}

// ---------- 交互 ----------
let touch = null;
cv.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    touch = { mode: "pan", x: e.touches[0].clientX, y: e.touches[0].clientY, vx: VIEW.x, vy: VIEW.y };
  } else if (e.touches.length === 2) {
    const [a, b] = e.touches;
    touch = {
      mode: "pinch", d: dist(a, b),
      cx: (a.clientX + b.clientX) / 2, cy: (a.clientY + b.clientY) / 2,
      vx: VIEW.x, vy: VIEW.y, s: VIEW.s
    };
  }
}, { passive: true });

cv.addEventListener("touchmove", e => {
  if (!touch) return;
  e.preventDefault();
  if (touch.mode === "pan" && e.touches.length === 1) {
    const t = e.touches[0];
    VIEW.x = touch.vx + (t.clientX - touch.x);
    VIEW.y = touch.vy + (t.clientY - touch.y);
    render();
  } else if (touch.mode === "pinch" && e.touches.length === 2) {
    const [a, b] = e.touches;
    const k = dist(a, b) / touch.d;
    const ns = Math.max(0.5, Math.min(8, touch.s * k));
    // 以双指中心为锚点缩放
    const rx = (touch.cx - touch.vx) / touch.s;
    const ry = (touch.cy - touch.vy) / touch.s;
    VIEW.s = ns;
    VIEW.x = touch.cx - rx * ns;
    VIEW.y = touch.cy - ry * ns;
    render();
  }
}, { passive: false });

cv.addEventListener("touchend", e => {
  if (touch && touch.mode === "pan" && e.changedTouches.length === 1) {
    const t = e.changedTouches[0];
    const moved = Math.hypot(t.clientX - touch.x, t.clientY - touch.y);
    if (moved < 8) pick(t.clientX, t.clientY);   // 没拖动 = 点击
  }
  touch = null;
}, { passive: true });

function dist(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
}

// 鼠标（桌面调试）
let mdown = null;
cv.addEventListener("mousedown", e => { mdown = { x: e.clientX, y: e.clientY, vx: VIEW.x, vy: VIEW.y, moved: 0 }; });
cv.addEventListener("mousemove", e => {
  if (!mdown) return;
  mdown.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  VIEW.x = mdown.vx + (e.clientX - mdown.x);
  VIEW.y = mdown.vy + (e.clientY - mdown.y);
  render();
});
cv.addEventListener("mouseup", e => {
  if (mdown && mdown.moved < 5) pick(e.clientX, e.clientY);
  mdown = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const ns = Math.max(0.5, Math.min(8, VIEW.s * k));
  const rx = (e.clientX - VIEW.x) / VIEW.s, ry = (e.clientY - VIEW.y) / VIEW.s;
  VIEW.s = ns;
  VIEW.x = e.clientX - rx * ns;
  VIEW.y = e.clientY - ry * ns;
  render();
}, { passive: false });

// ---------- 点选 ----------
function pick(sx, sy) {
  // 屏幕 → 世界坐标
  const wx = (sx - VIEW.x) / VIEW.s;
  const wy = (sy - VIEW.y) / VIEW.s;
  let best = null, bd = 14;   // 14px 命中半径
  for (const d of DATA) {
    const px = CX + d.x * SCALE, py = CY + d.y * SCALE;
    const dd = Math.hypot(px - wx, py - wy);
    if (dd < bd) { bd = dd; best = d; }
  }
  if (best) showCard(best.id);
}

async function showCard(id) {
  const p = document.getElementById("panel");
  p.style.display = "block";
  document.getElementById("p-title").textContent = "加载中…";
  document.getElementById("p-meta").textContent = "";
  document.getElementById("p-body").textContent = "";
  try {
    const r = await fetch("/card/" + id);
    const c = await r.json();
    if (c.error) throw new Error(c.error);
    document.getElementById("p-title").textContent = c.title || "(无标题)";
    document.getElementById("p-meta").textContent =
      `${c.kind || "?"} · ${c.topic || "无主题"} · ${(c.created_at || "").slice(0, 10)}`;
    document.getElementById("p-body").textContent = c.body || "";
  } catch (e) {
    document.getElementById("p-title").textContent = "读取失败";
    document.getElementById("p-body").textContent = String(e);
  }
}

function hidePanel() { document.getElementById("panel").style.display = "none"; }

window.addEventListener("resize", () => { resize(); });
load();
</script>
</body>
</html>
