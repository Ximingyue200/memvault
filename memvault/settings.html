<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memvault 控制台</title>
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --line:#e6e8e2; --tx:#1f2418; --tx2:#5c6552; --tx3:#98a08c;
  --green:#4caf50; --green2:#e8f5e9; --blue:#2f6fed; --amber:#e0a800; --red:#d64545;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.03);
}
[data-theme=dark]{
  --bg:#0d1117; --card:#161b22; --line:#2d333b; --tx:#e6e9ef; --tx2:#9aa3b0; --tx3:#6b7280;
  --green:#5fd48a; --green2:#16301f; --blue:#5aa9ff; --amber:#ffc857; --red:#ff6b6b;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:78px}

header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px}
header .title{font-weight:700;font-size:16px;white-space:nowrap}
#q{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:9px;
  padding:8px 12px;font-size:14px;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:9px;
  width:38px;height:38px;font-size:17px;cursor:pointer;flex:0 0 auto}

#side{position:fixed;top:0;left:0;bottom:0;width:236px;background:var(--card);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .22s;z-index:30;overflow-y:auto;padding:0 0 20px}
#side.open{transform:none}
#side .brand{padding:16px 18px 14px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line);margin-bottom:6px}
#side a{display:flex;align-items:center;gap:9px;padding:10px 18px;color:var(--tx2);font-size:14px;cursor:pointer;text-decoration:none}
#side a:hover{background:var(--bg);color:var(--tx)}
#side a.active{background:var(--green2);color:var(--green);font-weight:700;border-left:3px solid var(--green);padding-left:15px}
#side a .cnt{margin-left:auto;color:var(--tx3);font-size:12px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:25;display:none}
#mask.on{display:block}

main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--tx2);font-size:13px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}

.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.todo li:first-child{border-top:0}
.todo .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:#fff}
.todo .done .dot{background:var(--green)}
.todo .wait .dot{border:2px solid var(--line)}
.todo .txt{flex:1;min-width:0}
.todo .txt small{display:block;color:var(--tx3);font-size:12px}
.todo .go{font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  padding:4px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.stat .k{font-size:13px;color:var(--tx2);margin-bottom:8px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.5px;display:block;line-height:1.2}
.stat .u{font-size:12px;color:var(--tx3);margin-top:4px}
.stat b.green{color:var(--green)} .stat b.amber{color:var(--amber)} .stat b.blue{color:var(--blue)}

.rowline{display:flex;justify-content:space-between;align-items:center;padding:11px 0;
  border-top:1px solid var(--line);font-size:14px}
.rowline:first-of-type{border-top:0}
.rowline .lab{color:var(--tx2)}
.badge{font-size:12px;padding:2px 9px;border-radius:7px;background:var(--bg);color:var(--tx2)}
.badge.on{background:var(--green2);color:var(--green);font-weight:700}

.group{margin-bottom:22px}
.group h2{font-size:15px;font-weight:700;margin:0 0 10px 2px}
.subgroup{margin-bottom:10px}
.subtitle{font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.08em;
  margin:0 0 7px 4px;text-transform:uppercase}

.field{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:13px 15px;margin-bottom:9px}
.field .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field label{font-weight:600;flex:1;min-width:120px}
.field input[type=text],.field input[type=number]{flex:1.2;min-width:150px;background:var(--bg);
  border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px 10px;font-size:14px}
.field input:focus{outline:none;border-color:var(--blue)}
.field input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
.field .desc{color:var(--tx2);font-size:13px;margin-top:7px}
.field .cur{color:var(--tx3);font-size:12px;margin-top:5px;font-family:ui-monospace,monospace}
.field.changed{border-color:var(--green);background:var(--green2)}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--green2);color:var(--green);margin-left:6px}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);
  border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 14px;max-width:760px;margin:0 auto}
.actions button{flex:1;padding:12px;border:0;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
#save{background:var(--green);color:#fff}
#reload{background:var(--bg);color:var(--tx);border:1px solid var(--line)}

#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-70px);z-index:40;
  background:var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;
  transition:transform .25s;pointer-events:none;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#empty{color:var(--tx3);text-align:center;padding:30px 0;font-size:14px}

/* 供应商 */
.addbtn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;
  font-size:14px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.provhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.provhead b{font-size:16px}
.pill{background:var(--green2);color:var(--green);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.mini{border:1px solid var(--line);background:var(--card);color:var(--tx2);border-radius:8px;
  padding:5px 11px;font-size:12px;cursor:pointer}
.mini.danger{color:var(--red);border-color:var(--red)}
.mono{font-family:ui-monospace,monospace;font-size:12px;color:var(--tx2);margin:3px 0;word-break:break-all}
.models{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;
  display:inline-flex;align-items:center;gap:5px}
.chip i{color:var(--tx3);font-style:normal;font-size:11px}
.chip b{cursor:pointer;color:var(--tx3);font-weight:400}
.chip b:hover{color:var(--red)}
.row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row2 input,.row2 select{flex:1;min-width:110px;background:var(--bg);border:1px solid var(--line);
  color:var(--tx);border-radius:8px;padding:7px 9px;font-size:13px}
#pForm{display:none}
#pForm.on{display:block}
</style>
</head>
<body>

<header>
  <button class="iconbtn" id="menu">☰</button>
  <span class="title">memvault</span>
  <input id="q" placeholder="搜索参数… 例：注入 / cron / 模型">
  <button class="iconbtn" id="theme">🌙</button>
</header>

<div id="mask"></div>
<aside id="side"><div class="brand">memvault 控制台</div><div id="nav"></div></aside>

<main>
  <!-- ========= 仪表盘 ========= -->
  <div id="view-dash">
    <section class="card">
      <h3 id="setupTitle">检查中…</h3>
      <div class="sub">按顺序完成，每一项都能点过去直接改。</div>
      <div class="bar"><i id="setupBar" style="width:0%"></i></div>
      <ul class="todo" id="setupList"></ul>
    </section>

    <section class="grid" id="stats"></section>

    <section class="card">
      <h3>🌙 Dream 状态</h3>
      <div id="dreamRows"></div>
    </section>

    <section class="card">
      <h3>🧠 最近记忆</h3>
      <div id="recentRows"></div>
    </section>
  </div>

  <!-- ========= 接入配置（供应商 + 模型） ========= -->
  <div id="view-providers" style="display:none">
    <section class="card">
      <h3>🔌 接上你买的 AI 服务</h3>
      <div class="sub">网关把消息转发到这里配置的供应商。保存过的模型才会出现在前端列表。</div>
      <button class="addbtn" id="addProvider">+ 添加供应商</button>
      <div id="pForm" style="margin-top:12px">
        <div class="row2"><input id="pName" placeholder="名字，如 deepseek"></div>
        <div class="row2"><input id="pUrl" placeholder="Base URL，如 https://api.deepseek.com/v1"></div>
        <div class="row2"><input id="pKey" placeholder="API Key（sk-...）"></div>
        <div class="row2">
          <select id="pKind"><option value="openai">openai</option><option value="anthropic">anthropic</option></select>
          <button class="mini" id="pSave">保存</button>
          <button class="mini" id="pCancel">取消</button>
        </div>
      </div>
    </section>
    <div id="provList"></div>
  </div>

  <!-- ========= 配置 ========= -->
  <div id="view-config" style="display:none">
    <div id="form"></div>
    <div id="empty" style="display:none">没有匹配的参数</div>
  </div>
</main>

<div class="actions" id="actions" style="display:none">
  <button id="reload">重新加载</button>
  <button id="save">保存</button>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
let META=null, GROUPS=[], VALUES={}, STATS={}, RECENT=[];

/* ---------- 分类 ---------- */
const CATS=[
  {id:'dash',   name:'仪表盘',     icon:'📊', groups:[]},
  {id:'access', name:'接入配置',   icon:'🔌', groups:['网关','模型']},
  {id:'memory', name:'记忆与注入', icon:'🧠', groups:['注入','梦境','机器梦']},
  {id:'gen',    name:'生成器',     icon:'⚙️', groups:['程序','摘要']},
  {id:'task',   name:'任务',       icon:'📋', groups:['任务']},
  {id:'system', name:'系统',       icon:'🛠', groups:['其它']},
];
const catGroups=cat=>cat.groups.filter(g=>Object.values(META||{}).some(m=>m.group===g));

/* ---------- 主题 ---------- */
const theme=()=>localStorage.getItem('mv_theme')||'light';
function applyTheme(){document.documentElement.dataset.theme=theme();$('#theme').textContent=theme()==='dark'?'☀️':'🌙';}
$('#theme').onclick=()=>{localStorage.setItem('mv_theme',theme()==='dark'?'light':'dark');applyTheme();};

/* ---------- 侧栏 ---------- */
$('#menu').onclick=()=>{$('#side').classList.add('open');$('#mask').classList.add('on');};
$('#mask').onclick=closeSide;
function closeSide(){$('#side').classList.remove('open');$('#mask').classList.remove('on');}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err show':'show';
  setTimeout(()=>t.className='',2600);}
const isTrue=v=>v==='1'||v==='true'||v===true||v===1;

/* ---------- 加载 ---------- */
async function load(){
  try{
    const [rs,rt,rr]=await Promise.all([
      fetch('/settings',{cache:'no-store'}),
      fetch('/stats',{cache:'no-store'}).catch(()=>({json:async()=>({})})),
      fetch('/recent',{cache:'no-store'}).catch(()=>({json:async()=>({items:[]})}))
    ]);
    if(!rs.ok){toast('设置接口 '+rs.status,true);return;}
    const d=await rs.json();
    META=d.meta; GROUPS=d.groups; VALUES=d.values;
    try{STATS=await rt.json();}catch(e){STATS={};}
    try{RECENT=(await rr.json()).items||[];}catch(e){RECENT=[];}
    await loadProviders();
    renderNav(); renderDash(); renderConfig();
    route();
  }catch(e){toast('连不上网关',true);}
}

/* ---------- 导航 ---------- */
function renderNav(){
  const n=$('#nav'); n.innerHTML='';
  CATS.forEach(cat=>{
    const gs=catGroups(cat);
    const cnt=cat.id==='dash'?0:gs.reduce((s,g)=>s+Object.values(META).filter(m=>m.group===g).length,0);
    if(cat.id!=='dash'&&!gs.length) return;
    const a=document.createElement('a');
    a.dataset.cat=cat.id;
    a.innerHTML=`<span>${cat.icon} ${esc(cat.name)}</span>${cnt?`<span class="cnt">${cnt}</span>`:''}`;
    a.onclick=()=>go(cat.id);
    n.appendChild(a);
  });
  const used=new Set(CATS.flatMap(c=>c.groups));
  const orphan=[...new Set(Object.values(META).map(m=>m.group).filter(g=>!used.has(g)))];
  orphan.forEach(g=>{
    const a=document.createElement('a');
    a.innerHTML=`<span>· ${esc(g)}</span><span class="cnt">${Object.values(META).filter(m=>m.group===g).length}</span>`;
    a.onclick=()=>{location.hash='#/config';setTimeout(()=>document.getElementById('g-'+encodeURIComponent(g))?.scrollIntoView({behavior:'smooth'}),60);};
    n.appendChild(a);
  });
}

function go(catId){
  closeSide();
  if(catId==='dash'){ location.hash='#/dash'; }
  else if(catId==='access'){ location.hash='#/providers'; }
  else { location.hash='#/config'; setTimeout(()=>document.getElementById('cat-'+catId)?.scrollIntoView({behavior:'smooth',block:'start'}),80); }
}

/* ---------- 路由 ---------- */
function route(){
  const h=location.hash;
  const isDash=!h||h==='#/dash';
  const isProv=h.startsWith('#/providers');
  const isConfig=!isDash&&!isProv;
  $('#view-dash').style.display=isDash?'':'none';
  $('#view-providers').style.display=isProv?'':'none';
  $('#view-config').style.display=isConfig?'':'none';
  $('#actions').style.display=isConfig?'flex':'none';
  $('#q').style.display=isConfig?'':'none';
  $$('#nav a').forEach(a=>{
    const c=a.dataset.cat;
    a.classList.toggle('active',
      (isDash&&c==='dash')||(isProv&&c==='access')||(isConfig&&c&&c!=='dash'&&c!=='access'));
  });
  if(isConfig) renderConfig();
  if(isProv) renderProviders();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- 仪表盘 ---------- */
function renderDash(){
  const keys=Object.keys(META);
  const changed=keys.filter(k=>String(VALUES[k]??META[k].def)!==String(META[k].def));
  const left=keys.length-changed.length;
  $('#setupTitle').textContent = left===0?'全部 '+keys.length+' 项都已调整过':'还有 '+left+' 项是默认值';
  $('#setupBar').style.width=Math.max(6,Math.round(changed.length/keys.length*100))+'%';

  const critical=['inject.enabled','gw.topk','gw.min_score','dream.enabled','llm.model'];
  const items=keys.map(k=>{
    const m=META[k], cur=VALUES[k]??m.def;
    return {k,m,cur,isDefault:String(cur)===String(m.def)};
  }).sort((a,b)=>{
    const ca=critical.includes(a.k)?0:1, cb=critical.includes(b.k)?0:1;
    if(ca!==cb) return ca-cb;
    return a.isDefault?1:-1;
  });
  const L=$('#setupList'); L.innerHTML='';
  items.slice(0,8).forEach(({k,m,isDefault})=>{
    const li=document.createElement('li');
    li.className=isDefault?'wait':'done';
    li.innerHTML=`<span class="dot">${isDefault?'':'✓'}</span>
      <span class="txt">${esc(m.label)}<small>${esc((m.desc||'').slice(0,70))}</small></span>
      <button class="go">${isDefault?'去设置':'已改'}</button>`;
    li.querySelector('.go').onclick=()=>{
      location.hash='#/config';
      setTimeout(()=>{const el=document.querySelector('[data-k="'+k+'"]');
        if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus();}},80);
    };
    L.appendChild(li);
  });

  // 统计格
  const S=STATS||{};
  const cells=[
    {k:'记忆卡片', v:S.cards??'—', u:(S.active??'—')+' 条 active', c:'green'},
    {k:'注入条数', v:VALUES['gw.topk']??'—', u:'门槛 '+(VALUES['gw.min_score']??'—'), c:''},
    {k:'证据 / 原文', v:(S.evidence??'—'), u:'spans '+(S.spans??'—'), c:'blue'},
    {k:'昨夜 / 今日注入', v:(S.injections_today??'—'), u:'累计 '+(S.injections??'—'), c:'amber'},
    {k:'任务', v:S.focus_open??'—', u:'已完成 '+(S.focus_done??'—'), c:''},
    {k:'线索 / 编年史', v:(S.threads??'—'), u:'编年史 '+(S.chronicles??'—'), c:''},
  ];
  $('#stats').innerHTML=cells.map(x=>`<div class="stat">
      <div class="k">${x.k}</div><b class="${x.c}">${esc(String(x.v))}</b>
      <div class="u">${esc(String(x.u))}</div></div>`).join('');

  // Dream 状态
  const injOn=isTrue(VALUES['inject.enabled']);
  $('#dreamRows').innerHTML=`
    <div class="rowline"><span class="lab">梦境生成</span>
      <span>${isTrue(VALUES['dream.enabled'])?'<span class="badge on">开</span>':'<span class="badge">关</span>'}</span></div>
    <div class="rowline"><span class="lab">已生成</span><span>${S.dreams??'—'} 条</span></div>
    <div class="rowline"><span class="lab">待确认</span><span>${S.dreams_draft??'—'} 条</span></div>
    <div class="rowline"><span class="lab">上次 Dream</span><span>${esc((S.dream_last||'从未').slice(0,19))}</span></div>
    <div class="rowline"><span class="lab">自动注入</span>
      <span>${injOn?'<span class="badge on">已开启</span>':'<span class="badge">已关闭</span>'}</span></div>
    <div class="rowline"><span class="lab">上次注入</span><span>${esc((S.last_inject||'从未').slice(0,19))}</span></div>`;

  // 最近记忆
  const R=$('#recentRows');
  if(!RECENT.length){ R.innerHTML='<div class="rowline"><span class="lab">暂无</span></div>'; }
  else{
    R.innerHTML=RECENT.slice(0,6).map(x=>`
      <div class="rowline"><span>${esc(x.title)}</span>
        <span class="badge">${esc(x.when||'')}</span></div>`).join('');
  }
}

/* ---------- 配置页 ---------- */
function renderConfig(){
  if(!META) return;
  const used=new Set(), form=$('#form'); form.innerHTML='';
  const kw=($('#q').value||'').trim().toLowerCase();
  const match=([k,m])=>!kw||(k+' '+m.label+' '+(m.desc||'')).toLowerCase().includes(kw);
  let shown=0;
  for(const cat of CATS){
    if(cat.id==='dash') continue;
    const gs=catGroups(cat); if(!gs.length) continue;
    const items=Object.entries(META).filter(([k,m])=>gs.includes(m.group)&&!used.has(k)&&match([k,m]));
    if(!items.length) continue;
    items.forEach(([k])=>used.add(k));
    const sec=document.createElement('div'); sec.className='group'; sec.id='cat-'+cat.id;
    sec.innerHTML=`<h2>${cat.icon} ${esc(cat.name)}</h2>`;
    for(const g of gs){
      const gi=items.filter(([k,m])=>m.group===g);
      if(!gi.length) continue;
      const sub=document.createElement('div'); sub.className='subgroup';
      if(gs.length>1){const t=document.createElement('div');t.className='subtitle';t.textContent=g;sub.appendChild(t);}
      gi.forEach(([k,m])=>sub.appendChild(field(k,m)));
      sec.appendChild(sub);
    }
    form.appendChild(sec); shown+=items.length;
  }
  const rest=Object.entries(META).filter(([k,m])=>!used.has(k)&&match([k,m]));
  if(rest.length){
    const sec=document.createElement('div'); sec.className='group'; sec.id='cat-others';
    sec.innerHTML='<h2>🛠 其它</h2>';
    rest.forEach(([k,m])=>sec.appendChild(field(k,m)));
    form.appendChild(sec); shown+=rest.length;
  }
  $('#empty').style.display=shown?'none':'block';
}

function field(k,meta){
  const cur=VALUES[k]!==undefined?VALUES[k]:meta.def;
  const isBool=meta.input==='bool';
  const changed=String(cur)!==String(meta.def);
  const div=document.createElement('div');
  div.className='field'+(changed?' changed':'');
  const type=meta.type==='float'?'number':(isBool?'checkbox':'text');
  const step=meta.type==='float'?'0.05':'';
  div.innerHTML=`
    <div class="row">
      <label title="${esc(k)}">${esc(meta.label)}${changed?'<span class="tag">已改</span>':''}</label>
      ${isBool?`<input type="checkbox" data-k="${esc(k)}">`
              :`<input type="${type}" step="${step}" data-k="${esc(k)}" value="${esc(cur)}">`}
    </div>
    ${meta.desc?`<div class="desc">${esc(meta.desc)}</div>`:''}
    <div class="cur">${esc(k)} · 当前 ${esc(String(cur))}${changed?' · 默认 '+esc(String(meta.def)):''}</div>`;
  const inp=div.querySelector('[data-k]');
  if(isBool)inp.checked=isTrue(cur);
  return div;
}

/* ---------- 供应商 ---------- */
let PROV=[];
async function loadProviders(){
  try{const r=await fetch('/providers',{cache:'no-store'});PROV=(await r.json()).items||[];}
  catch(e){PROV=[];}
}
function renderProviders(){
  const box=$('#provList'); if(!box) return;
  box.innerHTML='';
  if(!PROV.length){
    box.innerHTML='<section class="card"><div class="sub">还没有供应商。点上面「+ 添加供应商」接一个。</div></section>';
    return;
  }
  PROV.forEach(p=>{
    const el=document.createElement('section'); el.className='card';
    const chips=(p.models||[]).map(m=>
      `<span class="chip">${esc(m.model_id)}<i>${esc(m.kind)}</i>`+
      `<b data-m="${esc(m.model_id)}" data-k="${esc(m.kind)}">×</b></span>`).join('')
      || '<span class="sub">还没有模型</span>';
    el.innerHTML=`
      <div class="provhead">
        <b>${esc(p.name)}</b><span class="pill">${esc(p.kind)}</span>
        <div style="flex:1"></div>
        <button class="mini" data-act="test">测试</button>
        <button class="mini" data-act="del">删除</button>
      </div>
      <div class="mono">${esc(p.base_url)}</div>
      <div class="mono">Key: ${p.has_key?esc(p.api_key):'（未设置）'}</div>
      <div class="models">${chips}</div>
      <div class="row2">
        <input class="mIn" list="ml-${p.id}" placeholder="选或输入模型 id">
        <datalist id="ml-${p.id}"></datalist>
        <select class="kIn"><option value="chat">chat</option><option value="embedding">embedding</option></select>
        <button class="mini" data-act="addmodel">加模型</button>
      </div>
      <div class="hint mono" data-hint="1"></div>`;
    // 异步拉上游模型列表，填进 datalist
    (async()=>{
      const hint=el.querySelector('[data-hint]');
      const dl=el.querySelector('datalist');
      if(hint) hint.textContent='拉取模型列表…';
      try{
        const r=await fetch('/providers/models?name='+encodeURIComponent(p.name),{cache:'no-store'});
        const d=await r.json();
        if(dl&&d.items) dl.innerHTML=d.items.map(x=>
          `<option value="${esc(x.id)}">${esc(x.name||'')}</option>`).join('');
        if(hint) hint.textContent = d.ok ? `上游有 ${d.count} 个模型，点输入框可下拉选`
          : `拉取失败：${d.error||'未知'}（可手输）`;
      }catch(e){ if(hint) hint.textContent='拉取失败（可手输）'; }
    })();
    el.querySelector('.provhead').addEventListener('click',async e=>{
      const b=e.target.closest('button'); if(!b) return;
      const a=b.dataset.act;
      if(a==='test'){
        b.textContent='测试中…'; b.disabled=true;
        try{
          const r=await fetch('/providers/test',{method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({name:p.name})});
          const d=await r.json();
          toast(d.ok?`连通 ${d.status} · ${d.models||0} 个模型 · ${d.ms}ms`:`失败：${d.error||'未知'}`, !d.ok);
        }catch(err){toast('测试失败',true);}
        b.textContent='测试'; b.disabled=false;
      }else if(a==='del'){
        if(!confirm('删除供应商 '+p.name+' 及其模型？')) return;
        await fetch('/providers?name='+encodeURIComponent(p.name),{method:'DELETE'});
        await loadProviders(); renderProviders(); toast('已删除');
      }else if(a==='addmodel'){
        const mi=el.querySelector('.mIn'), ki=el.querySelector('.kIn');
        const mid=(mi.value||'').trim(); if(!mid){toast('填模型 id',true);return;}
        await fetch('/providers/model',{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({provider:p.name,model_id:mid,kind:ki.value})});
        await loadProviders(); renderProviders(); toast('已加 '+mid);
      }
    });
    el.querySelectorAll('.chip b').forEach(x=>{
      x.onclick=async()=>{
        await fetch('/providers/model?provider='+encodeURIComponent(p.name)+
          '&model_id='+encodeURIComponent(x.dataset.m)+'&kind='+encodeURIComponent(x.dataset.k),
          {method:'DELETE'});
        await loadProviders(); renderProviders(); toast('已移除');
      };
    });
    box.appendChild(el);
  });
}

$('#addProvider').onclick=()=>$('#pForm').classList.toggle('on');
$('#pCancel').onclick=()=>$('#pForm').classList.remove('on');
$('#pSave').onclick=async()=>{
  const body={name:$('#pName').value.trim(),base_url:$('#pUrl').value.trim(),
    api_key:$('#pKey').value.trim(),kind:$('#pKind').value};
  if(!body.name||!body.base_url){toast('名字和 URL 必填',true);return;}
  try{
    const r=await fetch('/providers',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok||!d.ok){toast((d.error&&d.error.message)||'保存失败',true);return;}
    $('#pForm').classList.remove('on');
    $('#pName').value=$('#pUrl').value=$('#pKey').value='';
    await loadProviders(); renderProviders(); toast('已保存 '+body.name);
  }catch(e){toast('保存失败',true);}
};

let qt=null;
$('#q').addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(renderConfig,180);});

/* ---------- 保存 ---------- */
async function save(){
  if(!META){toast('还没加载',true);return;}
  const patch={};
  $$('[data-k]').forEach(inp=>{
    const k=inp.dataset.k, m=META[k];
    patch[k]=m.input==='bool'?(inp.checked?'1':'0'):inp.value;
  });
  try{
    const r=await fetch('/settings',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify(patch)});
    const d=await r.json();
    if((d.bad||[]).length) toast('保存 '+(d.saved||[]).length+' 项，拒绝 '+d.bad.join(','),true);
    else if((d.warn||[]).length) toast('已保存，注意：'+d.warn.join('；'),true);
    else toast('已保存 '+(d.saved||[]).length+' 项');
    Object.assign(VALUES,patch);
    renderDash(); renderConfig();
  }catch(e){toast('保存失败',true);}
}

$('#save').addEventListener('click',save);
$('#reload').addEventListener('click',load);
applyTheme();
load().then(()=>route());
</script>
