<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>cradle · 3D 记忆图</title>
<style>
:root{--bg:#06070a;--tx:#e6e9ef;--tx2:#8b95a5;--line:#1b2027}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;
  font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
#g{position:fixed;inset:0}

.hud{position:fixed;left:12px;top:12px;background:rgba(14,17,22,.86);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;backdrop-filter:blur(8px);max-width:200px}
.hud h1{margin:0 0 2px;font-size:13px;font-weight:600}
.hud .s{color:var(--tx2);font-size:11px;margin-bottom:9px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%}
.toggle{margin-top:9px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.toggle input{accent-color:#5aa9ff}

#panel{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(14,17,22,.94);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:44vh;
  overflow-y:auto;display:none;backdrop-filter:blur(10px)}
#panel.on{display:block}
#panel h2{margin:0 0 6px;font-size:14px;overflow-wrap:anywhere}
#panel .m{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin-bottom:8px}
#panel .tag{padding:1px 6px;border-radius:4px;background:#1c222b;border:1px solid var(--line)}
#panel .b{color:var(--tx2);font-size:12.5px;line-height:1.7;white-space:pre-wrap;
  overflow-wrap:anywhere;word-break:break-word}
#panel .x{position:absolute;right:12px;top:10px;color:var(--tx2);background:none;border:0;
  font-size:18px;cursor:pointer;padding:4px 8px}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--tx2);font-size:13px;background:var(--bg);z-index:9;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="g"></div>

<div class="hud">
  <a href="/admin" style="color:#8b95a5;text-decoration:none;font-size:11px">← 返回</a>
  <h1 style="margin-top:6px">cradle 3D</h1>
  <div class="s" id="stat">—</div>
  <div class="legend" id="legend"></div>
  <label class="toggle"><input type="checkbox" id="trim"> 只显示有连线的点</label>
</div>

<div id="panel">
  <button class="x" id="close">×</button>
  <h2 id="pt"></h2>
  <div class="m" id="pm"></div>
  <div class="b" id="pb"></div>
</div>

<div id="loading">加载中…</div>

<script src="https://fastly.jsdelivr.net/npm/3d-force-graph@1"></script>
<script>
const COLORS = {
  fact:'#5aa9ff', definition:'#4dabf7', event:'#ffc857', experience:'#ff8fab',
  preference:'#b48cff', tool:'#5fd48a', note:'#dfe3ea', rule:'#ff6b6b'
};
const KIND = {definition:'定义',fact:'事实',event:'事件',experience:'经验',
  preference:'偏好',tool:'工具',note:'笔记',rule:'规则'};

let G, DATA = null;

(async function(){
  const r = await fetch('/graph3d');
  DATA = await r.json();
  document.getElementById('stat').textContent =
    `${DATA.nodes.length.toLocaleString()} 个点 · ${DATA.edges.length.toLocaleString()} 条边`;

  // 图例
  const kinds = {};
  DATA.nodes.forEach(n => kinds[n.group] = (kinds[n.group]||0)+1);
  document.getElementById('legend').innerHTML = Object.entries(kinds)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<span><i class="dot" style="background:${COLORS[k]||'#888'}"></i>${KIND[k]||k} ${v}</span>`)
    .join('');

  build(DATA);
  document.getElementById('loading').classList.add('hide');
})();

function build(data){
  G = ForceGraph3D({ controlType:'trackball' })(document.getElementById('g'))
    .backgroundColor('#06070a')
    .graphData(data)
    .nodeVal('size')
    .nodeColor(n => COLORS[n.group] || '#888')
    .nodeOpacity(0.92)
    .nodeResolution(6)
    .nodeLabel(n => `${n.title}`)
    .cooldownTicks(0)
    .enableNodeDrag(false)
    .linkColor(l => l.color || 'rgba(120,140,170,.16)')
    .linkWidth(l => l.width || 0.4)
    .linkOpacity(0.5)
    .onNodeClick(n => showCard(n));

  // 相机初始位置
  setTimeout(() => { try { G.zoomToFit(600, 40); } catch(e){} }, 300);

  // 关键：等一拍再取尺寸，否则 clientWidth 可能是 0，canvas 画不出来
  const fit = () => {
    const el = document.getElementById('g');
    const w = el.clientWidth || window.innerWidth;
    const h = el.clientHeight || window.innerHeight;
    G.width(w).height(h);
  };
  fit();
  setTimeout(fit, 120);
  setTimeout(fit, 600);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 300));

  // 只显示有连线的点
  document.getElementById('trim').onchange = e => {
    if(!e.target.checked){ G.graphData(DATA); return; }
    const linked = new Set();
    DATA.edges.forEach(l => { linked.add(l.source); linked.add(l.target); });
    const ns = DATA.nodes.filter(n => linked.has(n.id));
    const ids = new Set(ns.map(n=>n.id));
    G.graphData({ nodes: ns, links: DATA.edges.filter(l => ids.has(l.source) && ids.has(l.target)) });
  };
}

async function showCard(n){
  const p = document.getElementById('panel');
  p.classList.add('on');
  document.getElementById('pt').textContent = n.title || '(无标题)';
  document.getElementById('pm').innerHTML =
    `<span class="tag">${KIND[n.group]||n.group||'—'}</span>` +
    (n.month ? `<span class="tag">${n.month}</span>` : '');
  document.getElementById('pb').textContent = '读取中…';
  try{
    const d = await fetch(`/card/${n.cid}`).then(r=>r.json());
    const c = d.card || d;
    document.getElementById('pb').textContent = c.body || c.content || '(空)';
  }catch(e){
    document.getElementById('pb').textContent = '读取失败';
  }
}
document.getElementById('close').onclick = () =>
  document.getElementById('panel').classList.remove('on');
</script>
</body>
</html>
