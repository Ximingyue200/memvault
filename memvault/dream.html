<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cradle 梦境</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font:15px/1.7 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;padding:16px 14px 80px}
header{position:sticky;top:0;background:#0d1117;padding:10px 0 12px;border-bottom:1px solid #21262d;z-index:9;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;font-weight:600;color:#bc8cff;letter-spacing:.3px}
.meta{font-size:12px;color:#6e7681}
button{background:#238636;border:0;border-radius:6px;padding:8px 14px;color:#fff;font-size:13px;cursor:pointer}
button:disabled{background:#21262d;color:#6e7681;cursor:default}
button.ghost{background:#161b22;border:1px solid #30363d;color:#8b949e}
button.ghost.on{border-color:#bc8cff;color:#bc8cff}
.bar{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.dream{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:15px 16px;margin-bottom:12px}
.dream.draft{border-left:3px solid #d29922}
.dream.confirmed{border-left:3px solid #3fb950}
.dream.rejected{opacity:.45;border-left:3px solid #484f58}
.dt{font-size:16px;font-weight:600;color:#e6edf3;line-height:1.45;margin-bottom:9px}
.db{font-size:14px;color:#b9c0c8;white-space:pre-wrap}
.df{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:11px;font-size:11.5px;color:#6e7681}
.pill{background:#21262d;padding:2px 7px;border-radius:4px;color:#8b949e}
.pill.ev{color:#58a6ff}
.why{font-size:12.5px;color:#7d8590;margin-top:9px;padding-top:9px;border-top:1px dashed #21262d}
.acts{display:flex;gap:6px;margin-left:auto}
.acts button{padding:4px 9px;font-size:11.5px;background:#21262d;color:#8b949e;border:1px solid #30363d}
.acts button.ok:hover{background:#238636;color:#fff;border-color:#238636}
.acts button.no:hover{background:#8b2c2c;color:#fff;border-color:#8b2c2c}
.empty{color:#6e7681;text-align:center;padding:56px 0;font-size:13.5px;line-height:2}
.log{font:12px/1.6 ui-monospace,monospace;color:#6e7681;background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px 12px;margin:12px 0;white-space:pre-wrap;display:none}
.log.on{display:block}
</style></head><body>

<header>
  <h1>cradle 梦境</h1>
  <span class="meta" id="meta">……</span>
  <button id="mk">做梦</button>
</header>

<div class="bar">
  <button class="ghost on" data-st="">全部</button>
  <button class="ghost" data-st="draft">待确认</button>
  <button class="ghost" data-st="confirmed">已确认</button>
  <button class="ghost" data-st="rejected">已否</button>
</div>

<div class="log" id="log"></div>
<div id="list"><div class="empty">载入中……</div></div>

<script>
let ST = '';
const $ = s => document.querySelector(s);

function esc(s){return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

async function load(){
  const r = await fetch('/dreams' + (ST ? '?status=' + ST : ''));
  const d = await r.json();
  const items = d.items || [];
  $('#meta').textContent = items.length + ' 条';
  if (!items.length){
    $('#list').innerHTML = '<div class="empty">还没有梦。<br>点右上角「做梦」，让它读最近的卡。</div>';
    return;
  }
  $('#list').innerHTML = items.map(x => `
    <div class="dream ${esc(x.status)}" data-id="${x.id}">
      <div class="dt">${esc(x.title)}</div>
      <div class="db">${esc(x.body)}</div>
      <div class="df">
        ${x.span ? `<span class="pill">${esc(x.span)}</span>` : ''}
        ${x.evidence ? `<span class="pill ev">证据 ${esc(x.evidence)}</span>` : ''}
        <span class="pill">${esc(x.status)}</span>
        <span>${esc(x.at)}</span>
        <div class="acts">
          ${x.status !== 'confirmed' ? '<button class="ok" data-a="confirmed">收下</button>' : ''}
          ${x.status !== 'rejected' ? '<button class="no" data-a="rejected">不要</button>' : ''}
        </div>
      </div>
      ${x.note ? `<div class="why">${esc(x.note)}</div>` : ''}
    </div>`).join('');
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]');
  if (b){
    const box = b.closest('.dream');
    const id = +box.dataset.id, st = b.dataset.a;
    const r = await fetch('/dreams/' + id + '/status', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status: st})
    });
    if (r.ok){ load(); } else { alert('失败 ' + r.status); }
    return;
  }
  const f = e.target.closest('button[data-st]');
  if (f){
    document.querySelectorAll('[data-st]').forEach(x=>x.classList.remove('on'));
    f.classList.add('on');
    ST = f.dataset.st;
    load();
  }
});

$('#mk').onclick = async () => {
  const btn = $('#mk'), log = $('#log');
  btn.disabled = true; btn.textContent = '在想……';
  log.classList.add('on'); log.textContent = '取最近 90 天的卡，按主题分组……';
  try{
    const r = await fetch('/dream/run', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({apply: true, days: 90})
    });
    const d = await r.json();
    if (!r.ok){ log.textContent = '失败：' + (d.error||r.status) + '\n' + (d.detail||''); }
    else {
      log.textContent = `分组 ${d.groups} · 卡片 ${d.cards} · prompt ${d.prompt_chars} 字 · LLM ${d.total_s}s\n产出 ${d.parsed} 条，入库 ${d.saved} 条`;
      load();
    }
  }catch(err){ log.textContent = '网络错误：' + err; }
  btn.disabled = false; btn.textContent = '做梦';
};

load();
</script>
</body></html>
