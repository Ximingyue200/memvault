<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MemVault · 摇篮</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--line2:#30363d;--fg:#c9d1d9;--dim:#8b949e;--dim2:#6e7681;
--acc:#58a6ff;--grn:#238636;--grn2:#2ea043;--amb:#d29922;--red:#f85149;--pur:#bc8cff}
body{background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
a{color:var(--acc);text-decoration:none}
.wrap{display:flex;min-height:100vh}
aside{width:196px;flex:none;border-right:1px solid var(--line);background:#0b0f14;padding:14px 0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 16px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{color:var(--acc);font-size:15px;letter-spacing:.6px}
.brand span{display:block;font-size:11.5px;color:var(--dim2);margin-top:3px}
nav a{display:block;padding:8px 16px;color:var(--dim);font-size:13.5px;border-left:2px solid transparent}
nav a:hover{background:#11161d;color:#e6edf3}
nav a.on{background:#11161d;color:#e6edf3;border-left-color:var(--acc)}
main{flex:1;min-width:0;padding:18px 22px 90px;max-width:1180px}
h1{font-size:19px;font-weight:600;color:#e6edf3;margin-bottom:2px}
.sub{font-size:12px;color:var(--dim2);margin-bottom:16px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .n{font-size:22px;font-weight:600;color:#e6edf3;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--dim2);margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--dim);margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.panel h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.04em;margin-bottom:10px;text-transform:uppercase}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:#0d1117;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;color:var(--fg);font-size:14px;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--acc)}
input[type=search]{flex:1;min-width:180px}
button{background:var(--grn);border:0;border-radius:6px;padding:8px 14px;color:#fff;font-size:13.5px;cursor:pointer}
button:hover{background:var(--grn2)}
button.ghost{background:#21262d;color:var(--fg);border:1px solid var(--line2)}
button.ghost:hover{background:#2d333b}
button.warn{background:#3d1f1f;color:#ffb4ac;border:1px solid #6b2b2b}
button.sm{padding:4px 9px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 14px;margin-bottom:9px}
.card:hover{border-color:var(--line2)}
.card .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.score{font:11px/1 ui-monospace,monospace;background:#1f6feb22;color:var(--acc);padding:3px 6px;border-radius:4px}
.tag{font-size:11px;color:var(--dim);background:#21262d;padding:2px 7px;border-radius:4px}
.tag.g{color:#7ee787;background:#12331f}.tag.a{color:#e3b341;background:#2b2413}
.tag.r{color:#ff9b93;background:#3d1f1f}.tag.p{color:var(--pur);background:#271b3a}
.ttl{font-size:15px;font-weight:600;color:#e6edf3}
.body{font-size:13.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:4.6em;overflow:hidden;cursor:pointer}
.body.open{max-height:none;color:var(--fg)}
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
.empty{color:var(--dim2);font-size:13px;padding:26px 0;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--dim2);font-weight:500;font-size:11.5px;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #1a1f26;vertical-align:top}
tr:hover td{background:#11161d}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:#0f141a;border-left:1px solid var(--line2);padding:18px;overflow:auto;z-index:30;box-shadow:-12px 0 40px #000a}
.drawer .x{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--dim)}
.sec{margin-top:16px}
.sec h3{font-size:11.5px;letter-spacing:.06em;color:var(--dim2);margin-bottom:7px;text-transform:uppercase}
.ev{border-left:2px solid #21262d;padding:2px 0 2px 10px;margin-bottom:8px;font-size:13px;color:var(--dim)}
.ev b{color:var(--fg);font-weight:600}
.bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--dim)}
.hint{font-size:12px;color:var(--dim2);margin-top:6px;line-height:1.6}
.kv{display:grid;grid-template-columns:1fr 130px;gap:6px 10px;align-items:center;margin-bottom:6px}
.kv label{font-size:13px;color:var(--dim);word-break:break-all}
.kv input{width:100%}
.savbar{position:sticky;bottom:0;background:#0d1117ee;border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px)}
canvas{width:100%;height:520px;background:#0b0f14;border:1px solid var(--line);border-radius:8px;display:block}
@media (max-width:820px){
 .wrap{display:block}
 aside{width:auto;height:auto;position:sticky;top:0;z-index:20;padding:8px 0;border-right:0;border-bottom:1px solid var(--line);background:#0b0f14}
 .brand{padding:0 12px 8px;border-bottom:0;margin-bottom:0;display:flex;gap:8px;align-items:baseline}
 .brand span{display:inline;margin:0}
 nav{display:flex;overflow-x:auto;white-space:nowrap;padding:0 6px}
 nav a{flex:0 0 auto;padding:7px 11px;border-left:0;border-bottom:2px solid transparent;font-size:12.5px}
 nav a.on{border-left:0;border-bottom-color:var(--acc);background:transparent}
 main{padding:14px 13px 80px}
 .kv{grid-template-columns:1fr 110px}
}
</style></head>
<body><div class="wrap">
<aside>
  <div class="brand"><b>MEMVAULT</b><span id="brandSub">摇篮 · live</span></div>
  <nav id="nav">
    <a href="#/overview" data-v="overview">概览</a>
    <a href="#/search" data-v="search">检索</a>
    <a href="#/cards" data-v="cards">卡片</a>
    <a href="#/pending" data-v="pending">待审</a>
    <a href="#/timeline" data-v="timeline">时间线</a>
    <a href="#/graph" data-v="graph">图谱</a>
    <a href="#/settings" data-v="settings">设置</a>
  </nav>
</aside>
<main id="main"><div class="empty">加载中…</div></main>
</div>
<div id="drawer"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n==null?'-':Number(n).toLocaleString('en-US'));
async function j(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
function toast(t,err){const d=document.createElement('div');d.textContent=t;
 d.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:'+(err?'#3d1f1f':'#1f2d1f')+';color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:99;border:1px solid '+(err?'#6b2b2b':'#2ea043');
 document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ---------- 概览 ---------- */
async function viewOverview(){
  const d=await j('/api/overview');
  const k=(n,t,x)=>`<div class="kpi"><div class="n">${n}</div><div class="k">${t}</div>${x?`<div class="d">${x}</div>`:''}</div>`;
  const kinds=d.by_kind.map(([k,v])=>`<div class="row" style="justify-content:space-between"><span class="tag">${esc(k||'—')}</span><span class="mono">${fmt(v)}</span></div>`).join('');
  const owners=d.by_owner.map(([k,v])=>`<div class="row" style="justify-content:space-between"><span class="tag ${k==='human'?'g':(k==='agent'?'p':'')}">${esc(k)}</span><span class="mono">${fmt(v)}</span></div>`).join('');
  const neverPct=d.active?Math.round(d.never/d.active*1000)/10:0;
  const dates=d.reports.map(r=>`<option>${esc(r)}</option>`).join('');
  $('#main').innerHTML=`
  <h1>概览</h1><div class="sub">更新于 ${new Date().toLocaleTimeString('zh-CN')} · 库 ${d.db_mb} MB · 备份 ${d.backups.length} 份</div>
  <div class="grid">
    ${k(fmt(d.cards),'卡片',`活跃 ${fmt(d.active)} · 归档 ${fmt(d.archive)} · 待审 ${fmt(d.proposal)}`)}
    ${k(fmt(d.spans),'原文切片',`覆盖 ${fmt(d.covered_spans)} · 向量 ${fmt(d.vectors)}`)}
    ${k(neverPct+'%','从未被想起',`${fmt(d.never)} / ${fmt(d.active)} 张活跃卡`)}
    ${k(d.heat.toFixed(3),'平均热度',`余额 ¥${d.balance==null?'-':d.balance}`)}
  </div>
  <div class="grid">
    ${k(fmt(d.today.inject),'今日注入',`平均 ${d.today.inject_chars} 字符`)}
    ${k(fmt(d.today.recall),'今日检索',`新增卡 ${fmt(d.today.new_cards)} · 新增原文 ${fmt(d.today.new_spans)}`)}
    ${k(fmt(d.pending_learn),'未消化切片','没有任何卡引用它')}
    ${k(d.last_backup||'-','最近备份','每日 03:30 自动')}
  </div>
  <div class="panel"><h2>分布</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:20px;margin:0">
      <div>${kinds}</div><div>${owners}</div>
    </div>
  </div>
  <div class="panel"><h2>日报</h2>
    <div class="row" style="margin-bottom:10px">
      <select id="rdate" style="flex:none">${dates||'<option>无</option>'}</select>
      <button class="ghost sm" id="rload">查看</button>
      <a href="/report/latest.md" target="_blank" style="font-size:12.5px">原始 md ↗</a>
    </div>
    <pre id="rbody" style="white-space:pre-wrap;font:13px/1.75 ui-monospace,monospace;color:var(--dim);max-height:420px;overflow:auto">${esc(d.report||'（还没有日报）')}</pre>
  </div>`;
  $('#rload').onclick=async()=>{const r=await fetch('/report/'+$('#rdate').value+'.md');$('#rbody').textContent=r.ok?await r.text():'读不到';};
}

/* ---------- 检索 ---------- */
let lastQuery='';
async function viewSearch(q){
  $('#main').innerHTML=`
  <h1>检索</h1><div class="sub">走 /find：向量 0.65 + BM25 0.35，带热度与取代降权</div>
  <div class="panel"><div class="row">
    <input id="q" type="search" placeholder="一句话 / 一个端口 / 一个包名…" value="${esc(q||'')}" autofocus>
    <select id="fk"><option value="">全部类型</option><option>definition</option><option>fact</option><option>event</option><option>experience</option><option>preference</option><option>tool</option></select>
    <select id="fo"><option value="">全部来源</option><option value="human">human</option><option value="both">both</option><option value="agent">agent</option></select>
    <button id="go">搜索</button>
  </div><div class="hint">回车即搜；点正文展开全文，点标题看详情。</div></div>
  <div id="out"></div>`;
  const run=async()=>{
    const s=$('#q').value.trim(); if(!s)return; lastQuery=s;
    $('#out').innerHTML='<div class="empty">检索中…</div>';
    const t0=performance.now();
    let d; try{d=await j('/find?q='+encodeURIComponent(s)+'&limit=40&max_chars=1200');}catch(e){$('#out').innerHTML='<div class="empty">出错 '+esc(e.message)+'</div>';return}
    const ms=Math.round(performance.now()-t0);
    let cards=d.cards||[];
    const fk=$('#fk').value, fo=$('#fo').value;
    if(fk)cards=cards.filter(c=>c.kind===fk); if(fo)cards=cards.filter(c=>c.owner===fo);
    $('#out').innerHTML=`<div class="sub" style="margin:4px 0 10px">${cards.length} 条 · ${ms} ms · 向量 ${d.vec_ok?'ok':'降级'}</div>`+
      (cards.length?cards.map(c=>cardHTML(c,true)).join(''):'<div class="empty">没有命中</div>');
  };
  $('#go').onclick=run; $('#q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run()}};
  if(q)run();
}
function cardHTML(c,withScore){
  return `<div class="card" data-id="${c.id}">
   <div class="top">${withScore&&c.score!=null?`<span class="score">${Number(c.score).toFixed(3)}</span>`:''}
     <span class="tag ${c.owner==='human'?'g':(c.owner==='agent'?'p':'')}">${esc(c.owner||'-')}</span>
     <span class="tag">${esc(c.kind||'-')}</span>
     <span class="ttl" style="cursor:pointer" onclick="openCard(${c.id})">${esc(c.title||'(无标题)')}</span>
     ${c.superseded_by?`<span class="tag a">已被 #${c.superseded_by} 取代</span>`:''}
     ${c.supersedes?`<span class="tag a">取代 #${c.supersedes}</span>`:''}
     ${c.status&&c.status!=='active'?`<span class="tag r">${esc(c.status)}</span>`:''}
   </div>
   <div class="body" onclick="this.classList.toggle('open')">${esc(c.content||c.body||'')}</div>
  </div>`;
}

/* ---------- 卡片 ---------- */
let cardState={offset:0,limit:30,sort:'recent',status:'active',kind:'',owner:'',q:''};
async function viewCards(){
  $('#main').innerHTML=`
  <h1>卡片</h1><div class="sub">全部断言卡片 · 点标题看证据与取代关系</div>
  <div class="panel"><div class="row">
    <input id="cq" type="search" placeholder="搜标题/正文" value="${esc(cardState.q)}">
    <select id="cs"><option value="active">活跃</option><option value="proposal">待审</option><option value="archive">归档</option><option value="">全部</option></select>
    <select id="ck"><option value="">全部类型</option><option>definition</option><option>fact</option><option>event</option><option>experience</option><option>preference</option><option>tool</option></select>
    <select id="co"><option value="">全部来源</option><option value="human">human</option><option value="both">both</option><option value="agent">agent</option></select>
    <select id="csort"><option value="recent">最新</option><option value="hot">最热</option><option value="cold">最冷</option></select>
    <button id="cgo">筛选</button>
  </div></div>
  <div id="cout"></div>`;
  $('#cs').value=cardState.status; $('#ck').value=cardState.kind; $('#co').value=cardState.owner; $('#csort').value=cardState.sort;
  const run=async(reset)=>{
    if(reset)cardState.offset=0;
    cardState.q=$('#cq').value.trim(); cardState.status=$('#cs').value; cardState.kind=$('#ck').value;
    cardState.owner=$('#co').value; cardState.sort=$('#csort').value;
    $('#cout').innerHTML='<div class="empty">加载中…</div>';
    const qs=new URLSearchParams({offset:cardState.offset,limit:cardState.limit,sort:cardState.sort});
    ['status','kind','owner'].forEach(k=>{if(cardState[k])qs.set(k,cardState[k])});
    if(cardState.q)qs.set('q',cardState.q);
    const d=await j('/api/cards?'+qs);
    $('#cout').innerHTML=`<div class="sub" style="margin:2px 0 8px">共 ${fmt(d.total)} 张 · 第 ${cardState.offset+1}–${cardState.offset+d.items.length} 张</div>`+
      (d.items.length?d.items.map(c=>cardHTML(c,false)).join(''):'<div class="empty">没有符合的卡片</div>')+
      `<div class="pager"><button class="ghost sm" id="prev">上一页</button><button class="ghost sm" id="next">下一页</button></div>`;
    $('#prev').onclick=()=>{if(cardState.offset>0){cardState.offset=Math.max(0,cardState.offset-cardState.limit);run()}};
    $('#next').onclick=()=>{if(cardState.offset+cardState.limit<d.total){cardState.offset+=cardState.limit;run()}};
  };
  $('#cgo').onclick=()=>run(true);
  $('#cq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run(true)}};
  run(true);
}

/* ---------- 卡片详情 ---------- */
async function openCard(id){
  const d=await j('/api/card/'+id), c=d.card;
  const ev=(d.evidence||[]).map(e=>`<div class="ev"><b>${esc(e.role||'-')}</b> ${esc(e.quote)}</div>`).join('')||'<div class="ev">没有证据</div>';
  const rl=(d.recalls||[]).map(r=>`<div class="ev mono">${esc(r.at)} · ${esc(r.query_hash)}</div>`).join('')||'<div class="ev">从未被检索命中</div>';
  $('#drawer').innerHTML=`<div class="drawer">
   <span class="x" onclick="closeDrawer()">✕</span>
   <div class="row" style="gap:6px;margin-bottom:8px">
     <span class="tag">#${c.id}</span><span class="tag ${c.owner==='human'?'g':(c.owner==='agent'?'p':'')}">${esc(c.owner)}</span>
     <span class="tag">${esc(c.kind)}</span><span class="tag">${esc(c.status)}</span>
     <span class="tag">${esc(c.scope)}${c.project_id?':'+esc(c.project_id):''}</span>
     ${c.pinned?`<span class="tag a">pinned</span>`:''}
   </div>
   <div class="ttl" style="font-size:16px;margin-bottom:8px">${esc(c.title)}</div>
   <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.8">${esc(c.body)}</div>
   <div class="sec"><h3>属性</h3>
     <div class="mono" style="color:var(--dim);font-size:12.5px;line-height:1.9">
     热度 ${Number(c.heat||0).toFixed(3)} · 重要度 ${c.importance} · 断言 ${esc(c.claim_type||'-')} · 主题 ${esc(c.topic||'-')}<br>
     创建 ${esc(c.created_at||'-')} · 更新 ${esc(c.updated_at||'-')}<br>
     ${c.supersedes?`本卡取代 #${c.supersedes}<br>`:''}${d.superseded_by?`本卡已被 #${d.superseded_by} 取代<br>`:''}
     </div>
   </div>
   <div class="sec"><h3>证据 ${d.evidence?d.evidence.length:0}</h3>${ev}</div>
   <div class="sec"><h3>命中记录 ${d.recalls?d.recalls.length:0}</h3>${rl}</div>
   <div class="sec"><h3>操作</h3><div class="row">
     ${c.status==='proposal'?`<button onclick="setCard(${c.id},'active',1)">批准</button><button class="warn" onclick="setCard(${c.id},'rejected',1)">拒绝</button>`:''}
     ${c.status==='active'?`<button class="ghost" onclick="setCard(${c.id},'archive',1)">归档</button>`:''}
     ${c.status==='archive'?`<button class="ghost" onclick="setCard(${c.id},'active',1)">恢复</button>`:''}
     <button class="ghost" onclick="setCard(${c.id},null,1,${c.pinned?0:1})">${c.pinned?'取消固定':'固定'}</button>
   </div></div>
  </div>`;
  document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};
}
function closeDrawer(){$('#drawer').innerHTML=''}
async function setCard(id,status,reload,pinned){
  const body={id}; if(status)body.status=status; if(pinned!=null)body.pinned=pinned;
  const r=await j('/api/card',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){toast('已保存');closeDrawer();if(location.hash.startsWith('#/cards'))viewCards();}
  else toast(r.error||'失败',true);
}

/* ---------- 待审 ---------- */
async function viewPending(){
  $('#main').innerHTML='<h1>待审</h1><div class="sub">agent 写入默认进这里，人工批准才转正</div><div id="pout"><div class="empty">加载中…</div></div>';
  const d=await j('/api/pending');
  if(!d.items.length){$('#pout').innerHTML='<div class="empty">没有待审项</div>';return}
  $('#pout').innerHTML=`<div class="panel"><div class="row"><button id="allok">全部批准</button><span class="hint">共 ${d.items.length} 条</span></div></div>`+
    d.items.map(c=>`<div class="card"><div class="top"><span class="tag p">proposal</span><span class="tag">${esc(c.kind)}</span>
      <span class="ttl" style="cursor:pointer" onclick="openCard(${c.id})">${esc(c.title)}</span></div>
      <div class="body open">${esc(c.body)}</div>
      <div class="row" style="margin-top:9px"><button class="sm" onclick="approve([${c.id}],'approve')">批准</button>
      <button class="sm warn" onclick="approve([${c.id}],'reject')">拒绝</button></div></div>`).join('');
  $('#allok').onclick=()=>approve(d.items.map(c=>c.id),'approve');
}
async function approve(ids,action){
  const r=await j('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,action})});
  if(r.ok){toast(action==='approve'?'已批准 '+r.n+' 条':'已拒绝 '+r.n+' 条');viewPending()}else toast(r.error||'失败',true);
}

/* ---------- 时间线 ---------- */
async function viewTimeline(){
  $('#main').innerHTML='<h1>时间线</h1><div class="sub">总纲 / 年 / 季 / 月 逐级压缩</div><div id="tl" class="empty">加载中…</div>';
  const d=await j('/chron'); const items=d.items||[];
  if(!items.length){$('#tl').textContent='还没有时间线';return}
  const order={core:0,year:1,quarter:2,month:3}, label={core:'总纲',year:'年',quarter:'季',month:'月'};
  items.sort((a,b)=>(order[a.granularity]-order[b.granularity])||String(a.start_ts||'').localeCompare(String(b.start_ts||'')));
  $('#tl').outerHTML=`<div id="tl"><div class="panel"><div class="row">`+
    items.map(i=>`<button class="ghost sm" data-pid="${esc(i.period_id)}">${esc(label[i.granularity]||i.granularity)} · ${esc(i.period_id)}</button>`).join('')+
    `</div></div><div id="tld"></div></div>`;
  $$('#tl button').forEach(b=>b.onclick=()=>showPeriod(b.dataset.pid));
  showPeriod(items[0].period_id);
}
const $$=s=>Array.from(document.querySelectorAll(s));
async function showPeriod(pid){
  const d=await j('/chron/'+encodeURIComponent(pid));
  const turns=(d.turns||[]).map(t=>`<div class="ev"><b>${esc(t.when||'')}</b> ${esc(t.what||'')}</div>`).join('');
  const threads=(d.threads||[]).map(t=>`<div class="ev"><b>${esc(t.name)}</b> <span class="tag">${esc(t.state||'')}</span> ${esc(t.last||'')}</div>`).join('');
  const ents=(d.entities||[]).map(e=>`<span class="tag">${esc(e)}</span>`).join(' ');
  $('#tld').innerHTML=`<div class="panel"><h2>${esc(d.title||pid)}</h2>
    <div class="sub">${esc(pid)} · ${fmt(d.msg_count||0)} 条 · ${esc(String(d.start_ts||'').slice(0,10))} → ${esc(String(d.end_ts||'').slice(0,10))}</div>
    <div style="white-space:pre-wrap;line-height:1.85">${esc(d.summary||'')}</div>
    ${turns?`<div class="sec"><h3>转折</h3>${turns}</div>`:''}
    ${threads?`<div class="sec"><h3>线索</h3>${threads}</div>`:''}
    ${ents?`<div class="sec"><h3>实体</h3>${ents}</div>`:''}</div>`;
}

/* ---------- 图谱 ---------- */
async function viewGraph(){
  $('#main').innerHTML=`<h1>图谱</h1><div class="sub">卡片共现关系（/graph 真实数据 · 按连接数取前 420 个节点）</div>
   <div class="panel"><div class="row"><button class="ghost sm" id="relayout">重新布局</button>
   <button class="ghost sm" id="more">只看有边的</button>
   <span class="hint" id="ginfo">加载中…</span></div></div>
   <canvas id="cv" style="width:100%;height:68vh;display:block;background:#0d1117;border:1px solid #21262d;border-radius:10px"></canvas>`;
  const d=await j('/graph?seeded=1&limit=420');
  const allN=d.nodes||[], allE=(d.edges||d.links||[]);
  const E=e=>({source:e.source!=null?e.source:(e.from!=null?e.from:e.src),
               target:e.target!=null?e.target:(e.to!=null?e.to:e.dst)});
  const EE=allE.map(E).filter(e=>e.source!=null&&e.target!=null);
  const deg=new Map();
  for(const e of EE){const a=String(e.source),b=String(e.target);
    deg.set(a,(deg.get(a)||0)+1);deg.set(b,(deg.get(b)||0)+1);}
  const N=420;
  const ranked=[...allN].sort((a,b)=>(deg.get(String(b.id))||0)-(deg.get(String(a.id))||0));
  const nodes=ranked.slice(0,N);
  const ids=new Set(nodes.map(n=>String(n.id)));
  let edges=EE.filter(e=>ids.has(String(e.source))&&ids.has(String(e.target)));
  if(edges.length>2400){edges=edges.sort((a,b)=>(b.edge_type==='fact')-(a.edge_type==='fact')).slice(0,2400);}
  $('#ginfo').textContent=`${nodes.length} 节点 · ${edges.length} 边（全库 ${allN.length} 节点 / ${EE.length} 边）`;

  const cv=$('#cv'), ctx=cv.getContext('2d');
  let W=600,H=420;
  function resize(){
    const r=cv.getBoundingClientRect();
    W=Math.max(240,r.width);H=Math.max(200,r.height);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();requestAnimationFrame(()=>{resize();seed();draw();});
  if(window.ResizeObserver){try{new ResizeObserver(()=>{resize();drawOnce();}).observe(cv);}catch(e){}}

  const idx=new Map(nodes.map((n,i)=>[String(n.id),i]));
  function seed(){
    nodes.forEach((n,i)=>{const a=i*2.399;const r=Math.min(W,H)*0.36*Math.sqrt((i+1)/Math.max(1,nodes.length));
      n.x=W/2+Math.cos(a)*r;n.y=H/2+Math.sin(a)*r;n.vx=0;n.vy=0;});
  }
  seed();
  const L=edges.map(e=>({a:idx.get(String(e.source)),b:idx.get(String(e.target))})).filter(e=>e.a!=null&&e.b!=null);
  const color={definition:'#58a6ff',fact:'#7ee787',event:'#e3b341',experience:'#bc8cff',preference:'#ff9b93',tool:'#39c5cf'};

  function tick(){
    for(let i=0;i<nodes.length;i++){const n=nodes[i];
      for(let k=i+1;k<nodes.length;k++){const m=nodes[k];
        let dx=m.x-n.x,dy=m.y-n.y,dd=dx*dx+dy*dy;
        if(dd<1||dd>12000)continue;
        const f=380/dd;dx*=f;dy*=f;n.vx-=dx;n.vy-=dy;m.vx+=dx;m.vy+=dy;}}
    for(const e of L){const a=nodes[e.a],b=nodes[e.b];const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||1;const f=(dd-60)*0.004;
      a.vx+=dx/dd*f*10;a.vy+=dy/dd*f*10;b.vx-=dx/dd*f*10;b.vy-=dy/dd*f*10;}
    for(const n of nodes){n.vx+=(W/2-n.x)*0.0008;n.vy+=(H/2-n.y)*0.0008;n.vx*=0.86;n.vy*=0.86;
      n.x+=n.vx;n.y+=n.vy;n.x=Math.max(6,Math.min(W-6,n.x));n.y=Math.max(6,Math.min(H-6,n.y));}
  }
  function drawOnce(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(88,166,255,.13)';ctx.lineWidth=1;ctx.beginPath();
    for(const e of L){const a=nodes[e.a],b=nodes[e.b];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}ctx.stroke();
    for(const n of nodes){const g=n.group||n.kind||'fact';ctx.fillStyle=color[g]||'#8b949e';
      const rr=n.size?Math.max(2,Math.min(4.2,1+n.size*0.4)):2.4;
      ctx.beginPath();ctx.arc(n.x,n.y,rr,0,6.2832);ctx.fill();}
  }
  let raf=0,frames=0;
  function draw(){
    tick();frames++;drawOnce();
    if(frames<320)raf=requestAnimationFrame(draw);
  }
  draw();
  $('#relayout').onclick=()=>{cancelAnimationFrame(raf);frames=0;seed();draw();};
  $('#more').onclick=async()=>{
    const keep=new Set();for(const e of edges){keep.add(String(e.source));keep.add(String(e.target));}
    $('#ginfo').textContent+=` · 其中有边的节点 ${keep.size} 个`;
  };
  cv.onclick=ev=>{
    const r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
    let best=null,bd=1e9;
    for(const n of nodes){const dd=(n.x-x)**2+(n.y-y)**2;if(dd<bd){bd=dd;best=n;}}
    if(best&&bd<160)openCard(best.cid||best.id);
  };
}

/* ---------- 设置 ---------- */
let settingsDirty={};
/* ---------- 网关环境（/etc/memvault-gw.env） ---------- */
async function renderGwEnv(){
  const host=document.createElement('div');
  const bar=document.querySelector('.savbar');
  if(!bar) return;
  bar.parentNode.insertBefore(host, bar);
  let d;
  try{ d=await j('/api/gwenv'); }catch(e){ host.innerHTML=''; return; }
  const rows=Object.entries(d.items||{}).map(([k,m])=>`
    <div class="kv" data-k="${esc(k)}">
      <div><div class="k">${esc(m.label||k)}</div>
      <div class="hint">${esc(k)} · ${esc(m.hint||'')}${m.def?` · 默认 ${esc(m.def)}`:''}</div></div>
      <input data-gk="${esc(k)}" value="${esc(m.v||'')}" ${m.secret?'placeholder="留空不改"':''}>
    </div>`).join('');
  host.innerHTML=`<div class="panel"><h2>网关环境 · memvault-gw</h2>
    <div class="hint" style="margin-bottom:8px">${esc(d.path||'')} — ${esc(d.restart_hint||'')}</div>
    ${rows}
    <div class="row" style="margin-top:10px"><button class="sm" id="gwsave">保存并重启网关</button>
    <span class="hint" id="gwst"></span></div></div>`;
  host.querySelector('#gwsave').onclick=async()=>{
    const upd={};
    host.querySelectorAll('input[data-gk]').forEach(i=>{
      const old=(d.items[i.dataset.gk]||{}).v||'';
      if(i.value && i.value!==old) upd[i.dataset.gk]=i.value;
    });
    if(!Object.keys(upd).length){toast('没有改动');return}
    const r=await j('/api/gwenv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(upd)});
    toast(r.ok?`已保存 ${r.saved} 项，网关重启${r.restart===0?'成功':'返回 '+r.restart}`:(r.error||'保存失败'), !r.ok);
    if(r.ok) renderGwEnv();
  };
}

async function viewSettings(){
  const d=await j('/api/settings');
  const groups={};
  for(const [k,v] of Object.entries(d.items)){
    const g=k.includes('.')?k.split('.')[0]:'其他';
    (groups[g]=groups[g]||[]).push([k,v]);
  }
  const gl=Object.keys(groups).sort();
  $('#main').innerHTML=`<h1>设置</h1><div class="sub">改动写回 settings 表；带 cron 的会同步 systemd timer</div>
   <div class="panel"><div class="row">
     <input id="sfilter" type="search" placeholder="过滤键名…" style="max-width:260px">
     <span class="hint">共 ${Object.keys(d.items).length} 个键</span>
   </div></div>
   <div id="sgroups">${gl.map(g=>`<div class="panel" data-g="${esc(g)}"><h2>${esc(g)}</h2>
     ${groups[g].map(([k,v])=>kvRow(k,v,d.defaults&&d.defaults[k])).join('')}</div>`).join('')}</div>
   <div class="savbar"><button id="save">保存改动</button><span class="hint" id="sstatus">未修改</span></div>`;
  $$('#sgroups input').forEach(inp=>inp.oninput=()=>{settingsDirty[inp.dataset.k]=inp.value;
    $('#sstatus').textContent=Object.keys(settingsDirty).length+' 项待保存'});
  $('#sfilter').oninput=e=>{
    const s=e.target.value.toLowerCase().trim();
    $$('#sgroups .kv').forEach(kv=>{
      const hit=!s||kv.dataset.k.toLowerCase().includes(s);
      kv.style.display=hit?'grid':'none';
    });
    $$('#sgroups .panel').forEach(p=>{
      const any=Array.from(p.querySelectorAll('.kv')).some(k=>k.style.display!=='none');
      p.style.display=any?'block':'none';
    });
  };
  $('#save').onclick=async()=>{
    if(!Object.keys(settingsDirty).length){toast('没有改动');return}
    const r=await j('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(settingsDirty)});
    if(r.ok){toast('已保存 '+r.saved+' 项');settingsDirty={};$('#sstatus').textContent='已保存';
      if(r.timer)toast('timer: '+JSON.stringify(r.timer));}
    else toast(r.error||'保存失败',true);
  };
  renderGwEnv();
}
function kvRow(k,v,dflt){
  const isBool=v==='0'||v==='1';
  return `<div class="kv" data-k="${esc(k)}"><label>${esc(k)}${dflt!=null&&String(dflt)!==String(v)?` <span class="tag a">默认 ${esc(dflt)}</span>`:''}</label>
   ${isBool?`<select data-k="${esc(k)}"><option value="1"${v==='1'?' selected':''}>开</option><option value="0"${v==='0'?' selected':''}>关</option></select>`
   :`<input data-k="${esc(k)}" value="${esc(v)}">`}</div>`;
}
/* ---------- 路由 ---------- */
function nav(v){$$('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v))}
async function route(){
  const h=location.hash.replace(/^#\//,'')||'overview';
  const [v,arg]=h.split('/');
  nav(v);
  try{
    if(v==='overview')await viewOverview();
    else if(v==='search')await viewSearch(decodeURIComponent(arg||''));
    else if(v==='cards')await viewCards();
    else if(v==='pending')await viewPending();
    else if(v==='timeline')await viewTimeline();
    else if(v==='graph')await viewGraph();
    else if(v==='settings')await viewSettings();
    else await viewOverview();
  }catch(e){$('#main').innerHTML='<div class="empty">页面出错：'+esc(e.message)+'</div>'}
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
fetch('/health').then(r=>r.json()).then(d=>{$('#brandSub').textContent=`摇篮 · ${d.cards} 卡 · ${d.spans||''} 片`}).catch(()=>{});
route();
</script></body></html>
